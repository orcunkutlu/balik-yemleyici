# Board: AI Thinker ESP32-CAM
# ========================================================
# BALIK YEMLEYICI
# ========================================================
# Özellikler:
#
# ✅ Sabah 07:30 otomatik yemleme
# ✅ Akşam 19:30 otomatik yemleme
# ✅ Manuel yemleme butonu
# ✅ Web panel
# ✅ Servo açı ayarı
# ✅ Flash LED kontrolü
# ✅ Çift yemleme koruması
# ✅ Servo detach (ısınma önleme)
# ✅ OTA update
#
# Şimdilik pasif bırakılanlar:
# ⏸ DS18B20 sıcaklık sensörü
# ⏸ HC-SR04 yem seviyesi sensörü
#
# Yarın kolayca aktif edebilmek için
# yorum satırı halinde bırakıldı.
# ========================================================

esphome:
  name: balik-yemleyici
  friendly_name: Balik Yemleyici


esp32:
  board: esp32cam
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: 3.1

psram:
  mode: quad
  speed: 80MHz

logger:

api:
  encryption:
    key: "9kKnZ/GA8GOJkSP13pSMAyJK8xtURfB8yPVRTIeUdHk="

ota:
  - platform: esphome

wifi:
  id: wifi_durum
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Balik Yemleyici WiFi"
    password: "12345678"

captive_portal:

web_server:
  port: 80

# --------------------------------------------------------
# SAAT
# --------------------------------------------------------

time:
  - platform: sntp
    id: saat_tarih
    timezone: Europe/Istanbul

    on_time:

      # --------------------------------------------------
      # SABAH YEMLEME
      # 07:30
      # --------------------------------------------------

      - seconds: 0
        minutes: 30
        hours: 7

        then:
          - button.press: yemleme_otomatik

      # --------------------------------------------------
      # AKŞAM YEMLEME
      # 19:30
      # --------------------------------------------------

      - seconds: 0
        minutes: 30
        hours: 19

        then:
          - button.press: yemleme_otomatik

# --------------------------------------------------------
# GLOBAL DEĞİŞKENLER
# --------------------------------------------------------

globals:
  # Son yemleme saati
  - id: son_yemleme
    type: std::string
    restore_value: no
    initial_value: '"Yok"'

  # Çift yemlemeyi engellemek için
  - id: son_yemleme_gunu
    type: int
    restore_value: no
    initial_value: '0'

  - id: son_yemleme_saati
    type: int
    restore_value: no
    initial_value: '-1'

  - id: feeding_animation
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ui_frame
    type: int
    restore_value: no
    initial_value: '0'

# --------------------------------------------------------
# ÇIKIŞLAR
# --------------------------------------------------------

output:
  # ------------------------------------------------------
  # SERVO PWM
  # ------------------------------------------------------

  - platform: ledc
    pin: GPIO16
    id: pwm_output
    frequency: 50 Hz

  # ------------------------------------------------------
  # ESP32-CAM FLASH LED
  # ------------------------------------------------------

  - platform: gpio
    pin: GPIO4
    id: flash_led

# --------------------------------------------------------
# SERVO
# --------------------------------------------------------

servo:
  - id: feeder_servo
    output: pwm_output

# --------------------------------------------------------
# SERVO AÇI AYARI
# WEB PANELDEN DEĞİŞTİRİLEBİLİR
# --------------------------------------------------------

number:
  - platform: template
    name: "Servo Açısı"
    id: servo_acisi
    optimistic: true
    min_value: -100
    max_value: 100
    step: 1
    initial_value: 30
    restore_value: true
    icon: "mdi:angle-obtuse"
# ========================================================
# YEMLEME BUTONLARI
# ========================================================

button:

  # ------------------------------------------------------
  # OTOMATİK YEMLEME
  # ------------------------------------------------------

  - platform: template
    id: yemleme_otomatik
    internal: true

    on_press:
      then:

        # ----------------------------------------------
        # Çift yemleme koruması
        # ----------------------------------------------

        - lambda: |-
            auto now = id(saat_tarih).now();

            if (
              id(son_yemleme_gunu) == now.day_of_year &&
              id(son_yemleme_saati) == now.hour
            ) {
              ESP_LOGD("feed", "Bu saatte zaten yemleme yapıldı.");
              return;
            }

            id(son_yemleme_gunu) = now.day_of_year;
            id(son_yemleme_saati) = now.hour;
            id(feeding_animation) = true;

        # ----------------------------------------------
        # Flash LED Aç
        # ----------------------------------------------

        - output.turn_on: flash_led

        # ----------------------------------------------
        # Servo dön
        # ----------------------------------------------

        - servo.write:
            id: feeder_servo
            level: !lambda "return id(servo_acisi).state / 100.0;"

        - delay: 1200ms

        # ----------------------------------------------
        # Servo başlangıç pozisyonu
        # ----------------------------------------------

        - servo.write:
            id: feeder_servo
            level: 30%

        - delay: 500ms

        # ----------------------------------------------
        # Servo enerjisini kes
        # ----------------------------------------------

        - servo.detach: feeder_servo

        # ----------------------------------------------
        # Flash LED Kapat
        # ----------------------------------------------

        - output.turn_off: flash_led
        - lambda: |-
            id(feeding_animation) = false;

        # ----------------------------------------------
        # Son yemleme saatini kaydet
        # ----------------------------------------------

        - lambda: |-
            auto now = id(saat_tarih).now();

            char buffer[10];

            sprintf(buffer,
                    "%02d:%02d",
                    now.hour,
                    now.minute);

            id(son_yemleme) = buffer;

  # ------------------------------------------------------
  # MANUEL YEMLEME BUTONU
  # ------------------------------------------------------

  - platform: template
    name: "Yemleme Yap"

    on_press:
      then:
        - button.press: yemleme_otomatik

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Adresi"
      id: wifi_ip

#  - platform: uptime
#    id: uptime_sensor
#    name: Uptime
#    format:
#      separator: " "
#      days: "G"
#      hours: "S"
#      minutes: "D"
#      seconds: "s"
#
# --------------------------------------------------------
# I2C OLED
# --------------------------------------------------------

i2c:
  sda: GPIO15
  scl: GPIO14
  scan: true

