# --------------------------------------------------------
# OLED DISPLAY
# --------------------------------------------------------

display:
  - platform: ssd1306_i2c
    model: SSD1306_128X64
    update_interval: 180ms
    address: 0x3C

    lambda: |-

      auto now = id(saat_tarih).now();

      if (id(feeding_animation))
      {
        // DIS CERCEVE
        it.rectangle(0, 0, 128, 64);

        // BASLIK
        it.printf(
          18,
          4,
          id(font_orta),
          "YEMLENİYOR"
        );

        // ANIMASYON CIZGISI
        int bar =
          (millis() / 120) % 90;

        // PROGRESS CERCEVE
        it.rectangle(
          18,
          28,
          92,
          12
        );

        // DOLAN BAR
        it.filled_rectangle(
          20,
          30,
          bar,
          8
        );

        // BALIK ANIMASYONU
        int fish_x =
          (millis() / 60) % 128;

        it.printf(
          fish_x - 20,
          48,
          id(font_kucuk),
          "><(((*>"
        );
      }

      // ==================================================
      // STATUS EKRANI
      // ==================================================

      else
      {
        // DIS CERCEVE
        it.rectangle(0, 0, 128, 64);

        // UST CIZGI
        it.line(0, 16, 128, 16);

        // SAAT
        it.strftime(
          4,
          -2,
          id(font_buyuk),
          "%H:%M",
          now
        );

        // BASLIK
        it.printf(
          78,
          2,
          id(font_kucuk),
          "BALIK"
        );

        it.printf(
          78,
          11,
          id(font_kucuk),
          "YEMLEYİCİ"
        );

        // ORTA AYIRICI
        it.line(0, 46, 128, 46);

        // SON YEMLEME
        it.printf(
          4,
          22,
          id(font_kucuk),
          "SON YEMLEME"
        );

        it.printf(
          90,
          22,
          id(font_kucuk),
          "%s",
          id(son_yemleme).c_str()
        );

        // UPTIME
        int uptime =
          (int) id(uptime_sensor).state;

        int gun =
          uptime / 86400;

        int saat =
          (uptime % 86400) / 3600;

        int dakika =
          (uptime % 3600) / 60;

        char uptime_buffer[32];

        sprintf(
          uptime_buffer,
          "%dg %ds %ddk",
          gun,
          saat,
          dakika
        );

        it.printf(
          4,
          34,
          id(font_kucuk),
          "UPTIME"
        );

        it.printf(
          64,
          34,
          id(font_kucuk),
          "%s",
          uptime_buffer
        );

        if (id(wifi_sensor_durum).state) {
          it.printf(4, 48, id(font_kucuk), "WiFi Bagli: %s", id(wifi_ip).state.c_str());
        } else {
          it.printf(4, 48, id(font_kucuk), "WiFi X");
        }
        it.printf(
          4,
          48,
          id(font_kucuk),
          "%s",
          id(wifi_ip).state.c_str()
        );

        // MINI AKVARYUM CIZGISI
        for (int i = 0; i < 128; i += 4)
        {
          it.draw_pixel_at(i, 63);
        }

        // KUCUK HAREKETLI BALIK
        int fish_x =
          (millis() / 140) % 140;

        it.printf(
          fish_x - 20,
          54,
          id(font_kucuk),
          "><>"
        );
      }

