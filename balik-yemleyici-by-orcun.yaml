# Board: Espressif ESP32-S3-DevKitC-1-N16R8V (16 MB Flash Quad, 8 MB PSRAM Octal)
# Definition: definitions/boards/esp32-s3-devkitc1-n16r8/manifest.yaml

esphome:
  name: balik-yemleyici-by-orcun
  friendly_name: "Balık Yemleyici By Orçun"
  on_boot:
    priority: -100
    then:
      - lvgl.page.show: page_boot
      - delay: 6s
      - lvgl.page.show: page_home

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc1-n16r8
  flash_size: 16MB
  framework:
    type: esp-idf
    
external_components:
  - source:
      type: local
      path: components
    components: [ ds3231 ]
    refresh: 0d
psram:
  mode: octal
  speed: 80MHz

logger:
  level: WARN
  baud_rate: 115200

api:
  encryption:
    key: "M7hZ9WDG0wVH8K3Hnq6YYGNfjz8UOD8FKq7JoPnZ94A="

ota:
  - platform: esphome

# ============================================================
# DS3231 - Saat
# ============================================================         

time:
  - platform: sntp
    id: internet_saati
    timezone: Europe/Istanbul
    servers:
      - time.google.com
      - time.cloudflare.com
      - 0.tr.pool.ntp.org

  - platform: ds3231
    id: rtc_saati
    address: 0x68
    i2c_id: saat_tutucu
    time_id: internet_saati
    update_interval: 1min

web_server:
  port: 80

spi:
  - id: tft_spi
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13
    
wifi:
  output_power: 8.5db
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "Balik Yemleyici WiFi"
    password: "12345678"
  on_disconnect:
    then:
      - lvgl.label.update:
          id: header_wifi_icon
          text: "\U000F092E"
          text_color: 0xEF4444
      - light.turn_on:
          id: rgb_led
          red: 100%

  on_connect:
    then:
      - lvgl.label.update:
          id: header_wifi_icon
          text: "\U000F05A9"
          text_color: 0x10B981

      - light.turn_on:
          id: rgb_led
          green: 100%

      - delay: 3s

      - light.turn_off: rgb_led

  manual_ip:
    static_ip: 192.168.1.69
    gateway: !secret wifi_gateway
    subnet: !secret wifi_subnet
    dns1: 8.8.8.8
    dns2: 1.1.1.1

captive_portal:
button:
  - platform: template
    name: "Test Yemleme"
    on_press:
      then:
        - if:
            condition:
              script.is_running: yemleme_script
            then:
              - logger.log:
                  level: WARN
                  format: "Yemleme zaten çalışıyor."
            else:
              - lambda: |-
                  auto now = id(internet_saati).now();
                  if (!now.is_valid())
                    return;
                  char saat_buffer[6];
                  snprintf( 
                    saat_buffer,
                    sizeof(saat_buffer),
                    "%02d:%02d",
                    now.hour,
                    now.minute
                  );
                  id(son_yemleme_saati) = saat_buffer;

i2c:
  - sda: GPIO8
    scl: GPIO17  # GPIO9 yerine
    scan: true
    id: saat_tutucu
    

output:
  - platform: ledc
    id: pwm_output
    pin: GPIO5
    frequency: 50Hz

servo:
  - id: yemleyici_servo
    output: pwm_output
    min_level: 0.025
    idle_level: 0.075
    max_level: 0.13
