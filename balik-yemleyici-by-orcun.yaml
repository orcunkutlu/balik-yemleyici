# Board: Espressif ESP32-S3-DevKitC-1-N16R8V (16 MB Flash Quad, 8 MB PSRAM Octal)
# Definition: definitions/boards/esp32-s3-devkitc1-n16r8/manifest.yaml

esphome:
  name: balik-yemleyici-by-orcun
  friendly_name: "Balık Yemleyici By Orçun"

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc1-n16r8
  flash_size: 16MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [ ds3231 ]
    refresh: 0d

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  reboot_timeout: 0s
  encryption:
    key: "M7hZ9WDG0wVH8K3Hnq6YYGNfjz8UOD8FKq7JoPnZ94A="

ota:
  - platform: esphome

# ============================================================
# DS3231 - Saat
# ============================================================         

time:
  - platform: sntp
    id: internet_saati
    timezone: Europe/Istanbul
    servers:
      - time.google.com
      - time.cloudflare.com
      - 0.tr.pool.ntp.org
  - platform: ds3231
    id: rtc_saati
    address: 0x68
    i2c_id: saat_tutucu
    time_id: internet_saati
    update_interval: 1min

web_server:
  port: 80

    
wifi:
  power_save_mode: NONE
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  post_connect_roaming: false
  ap:
    ssid: "Balik Yemleyici WiFi"
    password: "12345678"
    channel: 2
  on_disconnect:
    then:

      - light.turn_on:
          id: rgb_led
          red: 100%
          green: 0%
          blue: 0%

  on_connect:
    then:

      - light.turn_on:
          id: rgb_led
          green: 100%
          red: 0%
          blue: 0%

      - delay: 3s

      - light.turn_off: rgb_led

  manual_ip:
    static_ip: !secret wifi_static_ip
    gateway: !secret wifi_gateway
    subnet: !secret wifi_subnet
    dns1: 8.8.8.8
    dns2: 1.1.1.1
espnow:
  enable_on_boot: true
  channel: 2
  peers:
    - !secret servo_mac_address
  
  # ESP32-CAM'den her 30s'de bir gelen Heartbeat / Durum verisini yakalar
  on_receive:
    - lambda: |-
        if (size >= 2 && data[0] == 0x10) {
          ESP_LOGI("espnow_rx", "Slave cihazdan durum paketi alindi. Durum kodu: 0x%02X", data[1]);
          // İleride buraya alıcıdan gelen verilere göre tetiklenecek senaryolar eklenebilir
        }

captive_portal:
button:
   
  - platform: template
    name: "Yemlemeyi Başlat"
    id: btn_yemleme_baslat
    icon: "mdi:fish"
    on_press:
      then:
        - espnow.send:
            address: !secret servo_mac_address
            data: [0x01]
        - logger.log: "YEMLEME_KOMUTU (0x01) gönderildi."

  # 2. Alıcı Cihazdan Durum Raporu İsteyen Buton (0x03 Komutu)
  - platform: template
    name: "Cihaz Durumunu Sorgula"
    id: btn_durum_iste
    icon: "mdi:refresh"
    on_press:
      then:
        - espnow.send:
            address: !secret servo_mac_address
            data: [0x03]
        - logger.log: "DURUM_ISTE (0x03) komutu gönderildi."

  - platform: restart
    id: system_restart_btn
    name: "Cihazı Yeniden Başlat"

i2c:
  - sda: GPIO8
    scl: GPIO17
    scan: true
    id: saat_tutucu
    frequency: 100kHz
    

output:
  - platform: ledc
    id: tft_led
    pin: GPIO6
    frequency: 1000Hz


# ============================================================
# LVGL SCRIPT
# ============================================================

script:
  - id: espnow_yemleme_gonder
    mode: queued
    then:
      - logger.log: "ESP-NOW: Yemleme komutu gönderiliyor..."
      - espnow.send:
          address: !secret servo_mac_address
          data: [0x01]  # YEMLEME_KOMUTU
      - logger.log: "ESP-NOW: Yemleme komutu gönderildi"

  - id: espnow_servo_ayarla
    mode: queued
    then:
      - logger.log: "ESP-NOW: Servo açı ayarı gönderiliyor..."
      - espnow.send:
          address: !secret servo_mac_address
          data: !lambda |-
            int8_t aci = (int8_t)id(servo_acisi).state;
            return {0x02, (uint8_t)aci};
      - logger.log: "ESP-NOW: Servo açı ayarı gönderildi"

  - id: yemleme_script
    mode: single
    then:
      - script.execute: espnow_yemleme_gonder
      - lambda: |-
          id(feeding_now) = true;
      - logger.log: "Yemleme işlemi başlatıldı..."


      # 2. ADIM: Donanım LED'lerini yak ve Premium Arayüz Katmanını Aç
      - light.turn_on:
          id: rgb_led
          blue: 100%
          red: 0%
          green: 0%

      
      # 3. ADIM: KRİTİK GÜVENLİK GECİKMESİ (Açık kapatıldı)
      # LVGL'in modalı ekrana eksiksiz çizmesi için 60ms süre tanıyoruz, ardından donduruyoruz.
      - delay: 60ms

      - light.turn_off: rgb_led
      - delay: 2200ms

      # 6. ADIM: ÖNCE MOTORU AÇ, SONRA GİZLE (Açık kapatıldı)
      # LVGL motorunu canlandırıp ardından widget'ı güvenle kapatıp ekranı tazeletiyoruz.
      - logger.log: "Yemleme başarıyla tamamlandı, arayüz normale döndü."


# ============================================================
# RGB LED
# ============================================================
light:
  - platform: esp32_rmt_led_strip
    name: "RGB LED"
    id: rgb_led
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    effects:
      - pulse:
          name: slow_pulse
          transition_length: 1s
          update_interval: 2s
# ============================================================
# Global Değişkenler
# ============================================================  
globals:
  - id: feeding_now
    type: bool
    restore_value: no
    initial_value: "false"

number:
  - platform: template
    name: "Servo Açısı"
    id: servo_acisi
    optimistic: true
    min_value: -100
    max_value: 100
    step: 1
    initial_value: 92
    restore_value: true

  - platform: template
    name: "Yemleme Kapağı Açısı"
    id: num_servo_aci
    icon: "mdi:angle-acute"
    min_value: -100
    max_value: 100
    step: 5
    initial_value: 92
    unit_of_measurement: "%"
    mode: slider
    # Arayüzden açı değiştirildiğinde anında ESP-NOW ile Slave'e iletir
    set_action:
      then:
        - espnow.send:
            address: !secret servo_mac_address
            data: !lambda |-
              int8_t aci_degeri = (int8_t)x;
              return {0x02, (uint8_t)aci_degeri};
        - logger.log:
            format: "SERVO_ACI_AYARLA (0x02) gönderildi. Yeni Değer: %.0f%%"
            args: [ x ] # 284; Doğru Satır (Tırnaklar kaldırıldı)


# ============================================================
# SENSÖRLER
# ============================================================

# ============================================================
# METİN SENSÖRLER
# ============================================================

binary_sensor:
  - platform: status
    name: "Balık Yemleyici"
    id: wifi_status

  - platform: gpio
    pin:
      number: GPIO7
      mode: INPUT
    name: "Şebeke Gücü"
    id: sebeke_gucu
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_press:
      then:
        - logger.log: "ELEKTRİK GELDİ: Adaptör Modu"
        # Ekrandaki ikonu yeşil priz yapar
    on_release:
      then:
        - logger.log: "ELEKTRİK KESİLDİ: Batarya Modu!"
        # Ekrandaki ikonu kırmızı/turuncu pil yapar
