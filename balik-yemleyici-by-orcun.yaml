                    then:
                      - script.execute: yemleme_script

    - id: page_feed
      bg_color: 0x08142D
      pad_all: 0
      widgets:
        - buttonmatrix:
            id: plan_secici_matrix
            x: 5
            y: 45
            width: 230
            height: 38
            text_font: font_14
            one_checked: true
            rows:
              - buttons:
                  - id: btn_sel_p1
                    text: "Plan 1"
                    control: {checkable: true, checked: true}
                    on_press:
                      then:
                        - lambda: 'id(secili_plan) = 1;'
                  - id: btn_sel_p2
                    text: "Plan 2"
                    control: {checkable: true}
                    on_press:
                      then:
                        - lambda: 'id(secili_plan) = 2;'
                  - id: btn_sel_p3
                    text: "Plan 3"
                    control: {checkable: true}
                    on_press:
                      then:
                        - lambda: 'id(secili_plan) = 3;'

        # AKTİF PLAN DETAY KARTI
        - obj:
            x: 10
            y: 92
            width: 220
            height: 180
            bg_color: 0x070E1B
            radius: 16
            border_width: 1
            border_color: 0x162038
            pad_all: 0
            widgets:
              # Yeşil Aktif Göstergesi (İstediğin Checkmark yerine LVGL Yerel LED Kullanımı)
              - led:
                  id: plan_aktif_led
                  x: 15
                  y: 16
                  width: 10
                  height: 10
                  color: 0x10B981
                  brightness: 100%
              
              - label:
                  id: txt_plan_durum_etiket
