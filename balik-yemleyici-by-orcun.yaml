# ============================================================
# DOKUNMATİK EKRAN (XPT2046)
# ============================================================
touchscreen:
  platform: xpt2046
  id: ekranim_touch
  cs_pin: GPIO15
  spi_id: tft_spi
  interrupt_pin: GPIO16
  update_interval: 500ms
  transform:
    mirror_x: false
    mirror_y: true
  calibration:
    x_min: 450
    x_max: 3500
    y_min: 550
    y_max: 3770
  on_touch:
    - if:
        condition:
          lambda: 'return !id(feeding_now);'
        then:
          - if:
              condition: lvgl.is_paused
              then:
                - lvgl.resume:
                - light.turn_on: ekran_arka_isigi
# ============================================================
# SENSÖRLER
# ============================================================
sensor:
  - platform: dallas_temp
    name: "Su Sıcaklığı"
    id: water_temp
    web_server:
      sorting_group_id: group_status
      sorting_weight: 10
    update_interval: 10s
    unit_of_measurement: "°C"
    icon: "mdi:water-thermometer"
    device_class: "temperature"
    accuracy_decimals: 1
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(feeding_now);'
            then:
              - lvgl.label.update:
                  id: water_temp_value
                  text:
                    format: "%.1f"
                    args: ['x']
                  text_color: !lambda |-
                    if (x < 19.0) return lv_color_hex(0x3B82F6);
                    if (x < 21.0) return lv_color_hex(0x06B6D4);
                    if (x <= 23.0) return lv_color_hex(0x10B981);
                    if (x <= 26.0) return lv_color_hex(0xF59E0B);
                    return lv_color_hex(0xEF4444);
  - platform: template
    name: "Yem Seviyesi"
    id: yem_seviyesi_sensor
    web_server:
      sorting_group_id: group_status
      sorting_weight: 20
    icon: "mdi:percent-box"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    on_value:
      then:
        - lvgl.label.update:
            id: yem_seviyesi_value
            text:
              format: "%.0f %%"
              args: ['x']
            text_color: !lambda |-
              if (x < 15.0) return lv_color_hex(0xEF4444);
              if (x < 30.0) return lv_color_hex(0xF59E0B);
              if (x < 50.0) return lv_color_hex(0xFBBF24);
              if (x < 75.0) return lv_color_hex(0x84CC16);
              return lv_color_hex(0x10B981);
        - lvgl.bar.update:
            id: yem_seviyesi_bar
            value: !lambda 'return x;'
  # 1. Ham Voltajı Okuyan ve Gerçek Pil Voltajına Dönüştüren Sensör
  - platform: adc
    pin: GPIO5
    name: "Pil Voltajı"
    id: pil_voltaji
    web_server:
      sorting_group_id: group_status
      sorting_weight: 30
    icon: "mdi:battery"
    update_interval: 15s
    unit_of_measurement: "V"
    attenuation: 12db
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 15
          send_every: 3
    on_value:
      then:
        - if:
            condition:
              binary_sensor.is_on: batarya_modu
            then:
              - script.execute: guncelle_pil_yuzdesi
################################################################
#    VOLTAJ YUZDE KISMINI KULLANMAK DAHA MANTIKLI GELDI
################################################################

#    on_value_range:
#      - below: 3.15
#        then:
#          - logger.log: "!!! KRİTİK VOLTAJ !!! Pil tükendi, sistem güvenli kapatılıyor."
#          - lvgl.pause: 
#          - light.turn_off: ekran_arka_isigi
#          - delay: 2s
#          - deep_sleep.enter:
#              - id: derin_uyku
#              - sleep_duration: 15min
  # 2. Voltaj Değerini Yüzdeye (%) Dönüştüren Şablon Sensör
  - platform: template
    name: "Pil Yüzdesi"
    id: pil_yuzdesi
    web_server:
      sorting_group_id: group_status
      sorting_weight: 40
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery"
    lambda: |-
      float voltage = id(pil_voltaji).state;
      if (isnan(voltage)) return {};
      float max_v = 4.2;
      float min_v = 3.3;
      float percentage = ((voltage - min_v) / (max_v - min_v)) * 100.0;
      if (percentage > 100.0) percentage = 100.0;
      if (percentage < 0.0) percentage = 0.0;
      return percentage;
    on_value:
      # Batarya modundaysa — voltaja göre dinamik pil ikonu göster
      - if:
          condition:
            binary_sensor.is_on: batarya_modu
          then:
            - lvgl.label.update:
                id: pil_durum_icon
                text: !lambda |-
                  std::string icon;
                  if (x >= 100.0)      icon = "\U000F0079"; // mdi-battery (full)
                  else if (x > 90)     icon = "\U000F0082"; // mdi-battery-90
                  else if (x > 80)     icon = "\U000F0081"; // mdi-battery-80
                  else if (x > 70)     icon = "\U000F0080"; // mdi-battery-70
                  else if (x > 60)     icon = "\U000F007F"; // mdi-battery-60
                  else if (x > 50)     icon = "\U000F007E"; // mdi-battery-50
                  else if (x > 40)     icon = "\U000F007D"; // mdi-battery-40
                  else if (x > 30)     icon = "\U000F007C"; // mdi-battery-30
                  else if (x > 20)     icon = "\U000F007B"; // mdi-battery-20
                  else if (x > 10)     icon = "\U000F007A"; // mdi-battery-10
                  else if (x > 0)      icon = "\U000F008E"; // mdi-battery-outline
                  else                 icon = "\U000F0091"; // mdi-battery-unknown
                  return icon;
                text_color: !lambda |-
                  // Seviyeye göre renk: yeşil → sarı → kırmızı
                  if (x > 50) return lv_color_hex(0x10B981);  // Yeşil
                  if (x > 20) return lv_color_hex(0xF59E0B);  // Turuncu
                  return lv_color_hex(0xEF4444);               // Kırmızı (kritik)
            - lvgl.label.update:
                id: pil_durum_value
                text:
                  format: "%.0f%%"
                  args: [ 'x' ]
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 60s
  - platform: copy
    source_id: wifi_rssi
    id: wifi_signal_percent
    name: "WiFi Sinyal"
    web_server:
      sorting_group_id: group_system
      sorting_weight: 10
    icon: "mdi:wifi"
    filters: 
      - lambda: |-
          if (isnan(x)) return 0.0;
          return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_info_wifi_signal
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%% %0.0f", x);
              return std::string(buf);
