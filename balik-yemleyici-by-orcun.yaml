#####
# LVGL
#####
lvgl:
  page_wrap: false
  id: lvgl_id
  displays: ekranim
  theme:
    
    # Kart stili (tum widgetler icin temel)
    obj:
      bg_color: 0x1125      # Dark Navy Panel
      bg_opa: COVER
      border_width: 0
      radius: 12
      pad_all: 8
      
    # Label defaults
    label:
      text_font: font_kucuk
      text_color: 0xFFFF
    
    # Butonlar (navbar icin)
    button:
      bg_color: 0x1125
      bg_opa: COVER
      border_width: 0
      radius: 0
      text_color: 0x7BFF      # Soft Blue
      text_font: font_kucuk
      pad_all: 0
      pressed:
        bg_color: 0x1A3A
      checked:
        text_color: 0xF1A6    # Coral Red (active tab)
    
    # Arc/Progress (sicaklik gostergesi icin)
    arc:
      bg_color: 0x1125
      indicator:
        bg_color: 0xF1A6      # Coral Red
        bg_grad_color: 0xFE60  # Golden Yellow
        bg_grad_dir: VER
      knob:
        bg_color: 0xFFFF
        border_width: 2
        border_color: 0xF1A6

  # ===== STYLE DEFINITIONS =====
  style_definitions:
    # Header stili
    - id: style_header
      bg_color: 0x0A2A
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      height: 34
      width: 100%
      text_color: 0xFFFF
      text_font: font_orta

    # Kart stili (sicaklik karti)
    - id: style_card
      bg_color: 0x1125
      bg_opa: COVER
      border_width: 0
      radius: 16
      pad_all: 12
      shadow_color: 0x000000
      shadow_opa: 30%
      shadow_width: 8
      shadow_spread: 2

    # Kart ust accent cizgisi
    - id: style_card_accent
      bg_color: 0xF1A6        # Coral Red
      bg_opa: COVER
      border_width: 0
      radius: 4
      height: 6
      width: 100%

    # Sicaklik degeri (buyuk)
    - id: style_temp_value
      text_font: font_buyuk
      text_color: 0xFFFF
      text_align: CENTER

    # Birim label (°C)
    - id: style_temp_unit
      text_font: font_orta
      text_color: 0x7BFF
      text_align: CENTER

    # Alert strip - ALL OK
    - id: style_alert_ok
      bg_color: 0x1125
      bg_opa: COVER
      radius: 12
      pad_all: 8
      text_color: 0x2E9A      # Ocean Teal
      text_font: font_orta

    # Alert strip - WARNING
    - id: style_alert_warn
      bg_color: 0x1125
      bg_opa: COVER
      radius: 12
      pad_all: 8
      text_color: 0xF1A6      # Coral Red
      text_font: font_kucuk

    # Navbar stili
    - id: style_navbar
      bg_color: 0x1125
      bg_opa: COVER
      radius: 0
      border_width: 0
      height: 28
      width: 100%
      pad_all: 0

    # Navbar active indicator
    - id: style_nav_indicator
      bg_color: 0xF1A6
      height: 2
      width: 60
      radius: 1

    # WiFi status
    - id: style_wifi_online
      text_color: 0x2E9A      # Ocean Teal
      text_font: font_kucuk

    - id: style_wifi_offline
      text_color: 0xF1A6      # Coral Red
      text_font: font_kucuk

