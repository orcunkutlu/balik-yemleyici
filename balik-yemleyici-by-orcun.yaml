                  y: 95
                  width: 50
                  height: 30
                  text: "00"
                  text_align: CENTER
                  text_font: font_24
                  text_color: 0xF1F5F9
              
              - button:
                  id: btn_hr_down
                  x: 25
                  y: 135
                  width: 50
                  height: 35
                  bg_color: 0x1E293B
                  widgets:
                    - label: {text: "-", align: CENTER, text_font: font_24, text_color: 0xFBBF24}
                  on_click:
                    then:
                      - lambda: |-
                          int p = id(secili_plan);
                          if (p == 1) { auto c = id(yemleme_sira_1).make_call(); c.set_hour(id(yemleme_sira_1).hour == 0 ? 23 : id(yemleme_sira_1).hour - 1); c.perform(); }
                          else if (p == 2) { auto c = id(yemleme_sira_2).make_call(); c.set_hour(id(yemleme_sira_2).hour == 0 ? 23 : id(yemleme_sira_2).hour - 1); c.perform(); }
                          else if (p == 3) { auto c = id(yemleme_sira_3).make_call(); c.set_hour(id(yemleme_sira_3).hour == 0 ? 23 : id(yemleme_sira_3).hour - 1); c.perform(); }

              # Ayırıcı İki Nokta
              - label:
                  x: 85
                  y: 92
                  width: 50
                  height: 30
                  text: ":"
                  text_align: CENTER
                  text_font: font_24
                  text_color: 0x8E9FB8

              # Dakika Arttır/Azalt (10'arli Atlama)
              - button:
                  id: btn_min_up
                  x: 145
                  y: 50
                  width: 50
                  height: 35
                  bg_color: 0x1E293B
                  widgets:
                    - label: {text: "+", align: CENTER, text_font: font_24, text_color: 0xFBBF24}
                  on_click:
                    then:
                      - lambda: |-
                          int p = id(secili_plan);
                          if (p == 1) { auto c = id(yemleme_sira_1).make_call(); c.set_minute((id(yemleme_sira_1).minute + 10) % 60); c.perform(); }
                          else if (p == 2) { auto c = id(yemleme_sira_2).make_call(); c.set_minute((id(yemleme_sira_2).minute + 10) % 60); c.perform(); }
                          else if (p == 3) { auto c = id(yemleme_sira_3).make_call(); c.set_minute((id(yemleme_sira_3).minute + 10) % 60); c.perform(); }
              
              - label:
                  id: txt_plan_min
                  x: 145
                  y: 95
                  width: 50
                  height: 30
                  text: "00"
                  text_align: CENTER
                  text_font: font_24
                  text_color: 0xF1F5F9
              
              - button:
                  id: btn_min_down
                  x: 145
                  y: 135
                  width: 50
                  height: 35
                  bg_color: 0x1E293B
                  widgets:
                    - label: {text: "-", align: CENTER, text_font: font_24, text_color: 0xFBBF24}
                  on_click:
                    then:
                      - lambda: |-
                          int p = id(secili_plan);
                          if (p == 1) { auto c = id(yemleme_sira_1).make_call(); c.set_minute(id(yemleme_sira_1).minute == 0 ? 55 : id(yemleme_sira_1).minute - 5); c.perform(); }
                          else if (p == 2) { auto c = id(yemleme_sira_2).make_call(); c.set_minute(id(yemleme_sira_2).minute == 0 ? 55 : id(yemleme_sira_2).minute - 5); c.perform(); }
                          else if (p == 3) { auto c = id(yemleme_sira_3).make_call(); c.set_minute(id(yemleme_sira_3).minute == 0 ? 55 : id(yemleme_sira_3).minute - 5); c.perform(); }
    
    - id: page_log
      bg_color: 0x08142D
      widgets:
        - label:
            text: "Sistem Kayıtları Bekleniyor..."
            align: CENTER
            text_font: font_16
            text_color: 0x8E9FB8

    - id: page_settings
      bg_color: 0x08142D
      widgets:
        - button:
            width: 200
            height: 40
            align: TOP_MID
            y: 60
            widgets:
              - label: {text: "WIFI AYARLARI", align: CENTER, text_font: font_16}
        - button:
            width: 200
            height: 40
            align: TOP_MID
            y: 110
            widgets:
              - label: {text: "SISTEM REBOOT", align: CENTER, text_font: font_16}

    - id: page_boot
      bg_color: 0x08142D  # Ana derin lacivert arka plan
      pad_all: 0
      widgets:
        # Akvaryum / Balık Logosu Alanı (MDI İkonu ile Büyük Logo)
        - label:
            id: boot_logo
            x: 0
            y: 40
            width: 240
            height: 50
            text: "\U000F0EF4"  # MDI 'fishbowl' (Balık) İkonu
            text_font: mdi_icons  # Büyük ikon fontunuz (Genişletilmiş ikon setinde olmalı)
            text_align: CENTER
