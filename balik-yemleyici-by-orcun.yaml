                    border_width: 0
                    radius: 0
                    pad_all: 0
                    bg_color: 0x070E1B
                    checked:
                      bg_color: 0x1E293B
                      bg_opa: COVER
                    pressed:
                      bg_color: 0x0F172A
                      bg_opa: COVER
                    
                  rows:
                    - buttons:
                        - id: nav_home
                          text: "\U000F02DC"
                          width: 1
                          control:
                            checkable: true
                            checked: true

                        - id: nav_feed
                          text: "\U000F0F4B"
                          width: 1
                          control:
                            checkable: true
                      
                        - id: nav_log
                          text: "\U000F0C9E"
                          width: 1
                          control:
                            checkable: true
                        - id: nav_set
                          text: "\U000F0493"
                          width: 1
                          control:
                            checkable: true
                  on_click:
                    then:
                      - logger.log:
                          level: INFO
                          format: "Matrix clicked, button index: %d"
                          args: [ x ]
                      - if:
                          condition:
                            lambda: 'return x == id(nav_home);'
                          then:
                            - lvgl.page.show: page_home
                      - if:
                          condition:
                            lambda: 'return x == id(nav_feed);'
                          then:
                            - lvgl.page.show: page_feed
                      - if:
                          condition:
                            lambda: 'return x == id(nav_log);'
                          then:
                            - lvgl.page.show: page_log
                      - if:
                          condition:
                            lambda: 'return x == id(nav_set);'
                          then:
                            - lvgl.page.show: page_settings

    - id: page_boot
      bg_color: 0x0B0F14
      pad_all: 0
      widgets:
        - obj:
            id: lv_obj_0
            x: 0
            y: 0
            width: 240
            height: 320
            bg_color: 0x101010
            pad_all: 0
            widgets:
              - label:
                  id: boot_logo
                  x: 107
                  y: 80
                  width: 24
                  height: 24
                  text: "\U000F023A"
                  text_font: mdi_icons
                  text_color: 0xFBBF24
              - label:
                  id: lv_label_1
                  x: 56
                  y: 110
                  text: "AKVARYUM OS"
                  text_color: 0xFFFFFF
                  text_font: font_kucuk
              - spinner:
                  id: lv_spinner_2
                  x: 0
                  y: 10
                  width: 40
                  height: 40
                  align: CENTER
                  spin_time: 1000ms
                  arc_length: 60deg
                  arc_color: 0x818CF8
                  indicator:
                    arc_color: 0xFFFFFF
              - label:
                  id: boot_durum
                  x: 80
                  y: 220
                  text: "Başlatılıyor..."
                  text_color: 0x80A40A
                  text_font: font_kucuk

script:

  - id: yemleme_script
    mode: restart

    then:

      - lambda: |-
          id(feeding_now) = true;

      - light.turn_on:
          id: rgb_led
          blue: 100%

      - delay: 900ms

      - light.turn_off: rgb_led

      - lambda: |-
          id(feeding_now) = false;
interval:
  - interval: 30s
    then:
      - lambda: |-
          auto rtc = id(rtc_saati).now();
          if (rtc.is_valid()) {
            ESP_LOGI("DS3231_LAMBDA", "RTC Saat: %04d-%02d-%02d %02d:%02d:%02d | Timestamp: %ld",
                     rtc.year, rtc.month, rtc.day_of_month,
                     rtc.hour, rtc.minute, rtc.second, rtc.timestamp);
          } else {
            ESP_LOGW("DS3231_LAMBDA", "RTC saati geçersiz!");
          }
          
          auto sntp = id(internet_saati).now();
          if (sntp.is_valid()) {
            ESP_LOGI("SNTP_LAMBDA", "SNTP Saat: %04d-%02d-%02d %02d:%02d:%02d",
                     sntp.year, sntp.month, sntp.day_of_month,
                     sntp.hour, sntp.minute, sntp.second);
          } 
  - interval: 1s
    then:
      - lvgl.label.update:
          id: clock_value
          text:
            format: "%s"
            args:
              - 'id(internet_saati).now().strftime("%H:%M").c_str()'
  - interval: 60s
    then:
      - lvgl.label.update:
          id: header_datetime
          text:
            format: "%s"
            args:
              - 'id(internet_saati).now().strftime("%d.%m.%Y %H:%M").c_str()'
# ============================================================
# RGB LED
# ============================================================
light:
  - platform: esp32_rmt_led_strip
    name: "RGB LED"
    id: rgb_led
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    effects:
      - pulse:
          name: slow_pulse
          transition_length: 1s
          update_interval: 2s

# ============================================================
# Global Değişkenler
# ============================================================  
globals:
  - id: touch_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: touch_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: touch_debug
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: feeding_now
    type: bool
    restore_value: no
    initial_value: "false"

  - id: sistem_hazir
    type: bool
    restore_value: no
    initial_value: "false"

  - id: boot_yuzde
    type: int
    restore_value: no
    initial_value: "0"

  - id: son_yemleme_saati
    type: std::string
    restore_value: yes
    initial_value: '"--:--"'

  - id: yem_seviyesi_yuzde
    type: int
    restore_value: no
    initial_value: "72"
number:
  - platform: template
    name: "Servo Açısı"
    id: servo_acisi
    optimistic: true
    min_value: -100
    max_value: 100
    step: 1
    initial_value: 0
    restore_value: true
# ============================================================
# DOKUNMATİK EKRAN (XPT2046)
# ============================================================
touchscreen:
  platform: xpt2046
  id: ekranim_touch
  cs_pin: GPIO15
  spi_id: tft_spi
  threshold: 400
  interrupt_pin: GPIO16
  update_interval: 50ms
  transform:
    mirror_x: false
    mirror_y: true

  on_touch:
    - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );
  calibration:
    x_min: 450
    x_max: 3500
    y_min: 550
    y_max: 3770

# ============================================================
# DS18B20
# ============================================================
one_wire:
  - platform: gpio
    pin: GPIO4

# ============================================================
# SENSÖRLER
# ============================================================
sensor:
  - platform: dallas_temp
    name: "Water Temperature"
    id: water_temp
    update_interval: 2s
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    on_value:
      then:
        - lvgl.label.update:
            id: water_temp_value
            text:
              format: "%.1f"
              args: ['x']
  - platform: vl53l0x
    name: "Mesafe Sensörü"
    address: 0x29
    i2c_id: saat_tutucu
    update_interval: 5s
    long_range: false
    on_value:
      then:
        - lvgl.label.update:
            id: distance_value
            text:
              format: "%.0f mm"
              args:
                - x

  - platform: uptime
    name: "Uptime Sensor"
    id: uptime_sensor_seconds
    entity_category: diagnostic
    internal: true

  - platform: template
    id: free_heap

  - platform: template
    id: free_psram

  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 30s

    on_value:
      then:
        - text_sensor.template.publish:
            id: wifi_ikonu
            state: !lambda |-
              if (x > -55)
                return "1";

              if (x > -65)
                return "2";

              if (x > -75)
                return "3";

              return "0";

  - platform: copy
    source_id: wifi_rssi
    id: wifi_signal_percent
    name: "WiFi Sinyal"
    filters: 
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""

# ============================================================
# TFT EKRAN (ILI9341)
# ============================================================
display:
  - platform: mipi_spi
    model: ILI9341
    cs_pin: GPIO10
    dc_pin: GPIO9
    id: ekranim
    reset_pin: GPIO14
    spi_id: tft_spi
    rotation: 0°
    dimensions:
      width: 240
      height: 320
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never

# ============================================================
# METİN SENSÖRLER
# ============================================================
text_sensor:
  - platform: template
    id: wifi_ikonu
  - platform: uptime
    id: uptime_sensor_text
    name: Uptime
    format:
      separator: " "
      days: " Gün"
      hours: " Saat"
      minutes: " Dakika"
      seconds: " saniye"
    icon: mdi:clock-start
  - platform: wifi_info
    ip_address:
      name: "IP Adresi"
      id: wifi_ip
binary_sensor:
  - platform: status
    name: "Balık Yemleyici"
    id: wifi_status
