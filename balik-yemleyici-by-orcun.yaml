# ============================================================
# LVGL SCRIPT
# ============================================================
lvgl:
  page_wrap: false
  id: lvgl_id
  displays: ekranim
  theme:
    buttonmatrix:
      bg_color: 0x070E1B
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      items:
        bg_color: 0x070E1B
        bg_opa: 95%
        border_width: 0
        radius: 0
        pad_all: 0
        text_color: 0x8E9FB8      # Inactive (pasif) renk — gri-mavi
        text_font: mdi_icons
        # PRESSED (basılı anlık)
        pressed:
          bg_color: 0x0F172A
          bg_opa: COVER
        # CHECKED/ACTIVE (aktif sayfa) — ŞAHANE RENK
        checked:
          bg_color: 0x1E293B
          bg_opa: COVER
          text_color: 0xFBBF24     # Amber/Gold — aktif sayfa rengi ✨
    button:
        bg_color: 0x1976D2
        radius: 12
        text_color: 0xFFFFFF
  top_layer:
    bg_opa: TRANSP               # Şeffaf arka plan, sayfalar görünsün
    pad_all: 0
    
    widgets:
      - obj:
          id: navbar_container
          align: BOTTOM_MID       # Ekran alt orta
          x: 0
          y: 0
          width: 240
          height: 40
          bg_color: 0x070E1B
          bg_opa: 95%
          border_width: 0
          radius: 0
          pad_all: 0
          hidden: true
          widgets:
            - buttonmatrix:
                id: footer_nav
                x: 0
                y: 0
                width: 240
                height: 40
                align: CENTER
                bg_color: 0x070E1B
                border_width: 0
                pad_all: 0
                pad_row: 0
                pad_column: 0
                one_checked: true
                
                rows:
                  - buttons:
                      - id: nav_home
                        text: "\U000F02DC"      # mdi-clock
                        width: 1
                        control:
                          checkable: true
                          checked: true           # Boot'ta HOME aktif
                        on_press:
                          then:
                            - lvgl.page.show: page_home
                            - lvgl.matrix.button.update:
                                id: nav_home
                                control:
                                  checked: true
                            - lvgl.matrix.button.update:
                                id: nav_feed
                                control:
                                  checked: false
                            - lvgl.matrix.button.update:
                                id: nav_log
                                control:
                                  checked: false
                            - lvgl.matrix.button.update:
                                id: nav_set
                                control:
                                  checked: false
                                    
                      - id: nav_feed
                        text: "\U000F0F4B"      # mdi-food
                        width: 1
                        control:
                          checkable: true
                        on_press:
                          then:
                            - lvgl.page.show: page_feed
                            - lvgl.matrix.button.update:
                                id: nav_home
                                control:
                                  checked: false
                            - lvgl.matrix.button.update:
                                id: nav_feed
                                control:
                                  checked: true
                            - lvgl.matrix.button.update:
                                id: nav_log
                                control:
                                  checked: false
                            - lvgl.matrix.button.update:
                                id: nav_set
                                control:
                                  checked: false
                                    
                      - id: nav_log
                        text: "\U000F0C9E"      # mdi-chart-box
                        width: 1
                        control:
                          checkable: true
                        on_press:
                          then:
                            - lvgl.page.show: page_log
                            - lvgl.matrix.button.update:
                                id: nav_home
                                control:
                                  checked: false
                            - lvgl.matrix.button.update:
                                id: nav_feed
                                control:
                                  checked: false
                            - lvgl.matrix.button.update:
                                id: nav_log
                                control:
                                  checked: true
                            - lvgl.matrix.button.update:
                                id: nav_set
                                control:
                                  checked: false
                                    
                      - id: nav_set
                        text: "\U000F0493"      # mdi-cog
                        width: 1
                        control:
                          checkable: true
                        on_press:
                          then:
                            - lvgl.page.show: page_settings
                            - lvgl.matrix.button.update:
                                id: nav_home
                                control:
                                  checked: false
                            - lvgl.matrix.button.update:
                                id: nav_feed
                                control:
                                  checked: false
                            - lvgl.matrix.button.update:
                                id: nav_log
                                control:
                                  checked: false
                            - lvgl.matrix.button.update:
                                id: nav_set
                                control:
                                  checked: true
