                  y: 50
                  width: 50
                  height: 35
                  bg_color: 0x1E293B
                  widgets:
                    - label: {text: "+", align: CENTER, text_font: font_24, text_color: 0xFBBF24}
                  on_click:
                    then:
                      - lambda: |-
                          int p = id(secili_plan);
                          if (p == 1) { auto c = id(yemleme_sira_1).make_call(); c.set_hour((id(yemleme_sira_1).hour + 1) % 24); c.perform(); }
                          else if (p == 2) { auto c = id(yemleme_sira_2).make_call(); c.set_hour((id(yemleme_sira_2).hour + 1) % 24); c.perform(); }
                          else if (p == 3) { auto c = id(yemleme_sira_3).make_call(); c.set_hour((id(yemleme_sira_3).hour + 1) % 24); c.perform(); }
              
              - label:
                  id: txt_plan_hour
