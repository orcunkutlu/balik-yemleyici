script:
  - id: espnow_yemleme_gonder
    mode: queued
    then:
      - logger.log: "ESP-NOW: Yemleme komutu gönderiliyor..."
      - espnow.send:
          address: !secret servo_mac_address
          data: [0x01]  # YEMLEME_KOMUTU
      - logger.log: "ESP-NOW: Yemleme komutu gönderildi"

  - id: espnow_servo_ayarla
    mode: queued
    then:
      - logger.log: "ESP-NOW: Servo açı ayarı gönderiliyor..."
      - espnow.send:
          address: !secret servo_mac_address
          data: !lambda |-
            int8_t aci = (int8_t)id(servo_acisi).state;
            return {0x02, (uint8_t)aci};
      - logger.log: "ESP-NOW: Servo açı ayarı gönderildi"

  - id: yemleme_script
    mode: single
    then:
      - script.execute: espnow_yemleme_gonder
      - lambda: |-
          id(feeding_now) = true;
      - logger.log: "Yemleme işlemi başlatıldı..."

      - if:
          condition:
            - lvgl.is_paused
          then:
            - lvgl.resume:
            - light.turn_on: ekran_arka_isigi
            - delay: 100ms # Ekranın ve donanımın kendine gelme payı

      # 2. ADIM: Donanım LED'lerini yak ve Premium Arayüz Katmanını Aç
      - light.turn_on:
          id: rgb_led
          blue: 100%
          red: 0%
          green: 0%

      - lvgl.widget.show: premium_feed_modal
      
      # 3. ADIM: KRİTİK GÜVENLİK GECİKMESİ (Açık kapatıldı)
      # LVGL'in modalı ekrana eksiksiz çizmesi için 60ms süre tanıyoruz, ardından donduruyoruz.
      - delay: 60ms

      - light.turn_off: rgb_led
      - delay: 2200ms

      # 5. ADIM: Zaman Kaydı İşlemleri
      - lambda: |-
          id(feeding_now) = false;
          auto now = id(internet_saati).now();
          if (!now.is_valid()) return;
          char buffer[6];
          sprintf(buffer, "%02d:%02d", now.hour, now.minute);
          id(son_yemleme_saati) = buffer;

      # 6. ADIM: ÖNCE MOTORU AÇ, SONRA GİZLE (Açık kapatıldı)
      # LVGL motorunu canlandırıp ardından widget'ı güvenle kapatıp ekranı tazeletiyoruz.
      - lvgl.widget.hide: premium_feed_modal
      - logger.log: "Yemleme başarıyla tamamlandı, arayüz normale döndü."

interval:
  - interval: 1s
    then:
      if:
        condition:
          lambda: 'return !id(feeding_now);'
        then:
      
        # 1. Ana Ekran Verilerini Canlandırma
        - lvgl.label.update:
            id: clock_value
            text:
              format: "%s"
              args: ['id(internet_saati).now().strftime("%H:%M").c_str()']
        - lvgl.label.update:
            id: lbl_set_timeout
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%0.0f saniye", id(ekran_bekleme_suresi).state);
              return std::string(buf);
        - lvgl.label.update:
            id: lbl_set_brightness
            text: !lambda |-
              char buf[20];
              snprintf(buf, sizeof(buf), "Mevcut: %%%0.0f", id(ekran_parlakligi).state);
              return std::string(buf);
  
        - lvgl.label.update:
            id: lbl_info_ip
            text: !lambda |-
              return id(wifi_ip).state;
  
        - lvgl.label.update:
            id: lbl_info_wifi_signal
            text: !lambda |-
              char buf[16];
              // Yüzde işaretini kaçırmak için %% kullanıyoruz, %0.0f virgülsüz sayı basar
              snprintf(buf, sizeof(buf), "%% %0.0f", id(wifi_signal_percent).state);
              return std::string(buf);
        - lvgl.label.update:
            id: txt_plan_hour
            text: !lambda |-
              int h = 0;
              if (id(secili_plan) == 1) h = id(yemleme_sira_1).hour;
              else if (id(secili_plan) == 2) h = id(yemleme_sira_2).hour;
              else h = id(yemleme_sira_3).hour;
              char buf[4];
              sprintf(buf, "%02d", h);
              return std::string(buf);
  
        - lvgl.label.update:
            id: txt_plan_min
            text: !lambda |-
              int m = 0;
              if (id(secili_plan) == 1) m = id(yemleme_sira_1).minute;
              else if (id(secili_plan) == 2) m = id(yemleme_sira_2).minute;
              else m = id(yemleme_sira_3).minute;
              char buf[4];
              sprintf(buf, "%02d", m);
              return std::string(buf);
  
        # Buton Metnini Dinamik Güncelleme (AÇ / KAPAT)
        - lvgl.label.update:
            id: txt_plan_status_btn
            text: !lambda |-
              bool aktif = false;
              if (id(secili_plan) == 1) aktif = id(yemleme_1_aktif).state;
              else if (id(secili_plan) == 2) aktif = id(yemleme_2_aktif).state;
              else if (id(secili_plan) == 3) aktif = id(yemleme_3_aktif).state;
              return aktif ? "KAPAT" : "AÇ";
        - lvgl.label.update:
            id: txt_plan_durum_etiket
            text: !lambda |-
              bool aktif = false;
              if (id(secili_plan) == 1) aktif = id(yemleme_1_aktif).state;
              else if (id(secili_plan) == 2) aktif = id(yemleme_2_aktif).state;
              else if (id(secili_plan) == 3) aktif = id(yemleme_3_aktif).state;
              return aktif ? "Plan Aktif" : "Plan Pasif";
        # Yeşil LED Durum Göstergesini Canlandırma
        - if:
            condition:
              lambda: |-
                if (id(secili_plan) == 1) return id(yemleme_1_aktif).state;
                if (id(secili_plan) == 2) return id(yemleme_2_aktif).state;
                return id(yemleme_3_aktif).state;
            then: 
              - light.turn_on:
                  id: plan_aktif_isik
                  red: 0%      # Kırmızı kapalı
                  green: 100%  # Yeşil tam açık
                  blue: 0%     # Mavi kapalı
            else: 
              - light.turn_off: plan_aktif_isik
        - lvgl.label.update:
            id: uptime_value
            text: !lambda |-
              return id(uptime_sensor_text).state;
        # Tesis edilen tüm planları kontrol edip sıradaki en yakın olanı ekrana basar
        - lvgl.label.update:
            id: next_feed_value
            text: !lambda |-
              // KORUMA: Sistem saati geçerli değilse hesaplama yapma, hata gösterme
              auto time_now = id(rtc_saati).now();
              if (!time_now.is_valid()) {
                return std::string("--:--");
              }
  
              int current_minute = time_now.hour * 60 + time_now.minute;
              int feed1 = id(yemleme_1_aktif).state ? id(yemleme_sira_1).hour * 60 + id(yemleme_sira_1).minute : -1;
              int feed2 = id(yemleme_2_aktif).state ? id(yemleme_sira_2).hour * 60 + id(yemleme_sira_2).minute : -1;
              int feed3 = id(yemleme_3_aktif).state ? id(yemleme_sira_3).hour * 60 + id(yemleme_sira_3).minute : -1;
              
              int next_feed = -1;
              if (feed1 > current_minute) next_feed = feed1;
              if (feed2 > current_minute && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
              if (feed3 > current_minute && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
              
              if (next_feed == -1) {
                if (feed1 != -1) next_feed = feed1;
                if (feed2 != -1 && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
                if (feed3 != -1 && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
              }
              
              if (next_feed == -1) return std::string("Yok");
              
              char buffer[16];
              snprintf(buffer, sizeof(buffer), "%02d:%02d", next_feed / 60, next_feed % 60);
              return std::string(buffer);
  
        - lvgl.label.update:
            id: last_feed_value
            text:
              format: "%s"
              args: ['id(son_yemleme_saati).c_str()']

  - interval: 30s
    then:
      - lambda: |-
          auto rtc = id(rtc_saati).now();
          auto sntp = id(internet_saati).now();
          if (sntp.is_valid()) {
            ESP_LOGI("SISTEM", "Zaman Senkronize.");
          }
  - interval: 60s
    then:
      - lvgl.label.update:
          id: header_datetime
          text: !lambda |-
            auto now = id(internet_saati).now();
            if (!now.is_valid()) return std::string("Zaman Bekleniyor");
            
            // Türkçe ay isimleri dizisi (Oca=1, Şub=2... Ara=12 şeklinde eşleşir)
            const char* aylar[] = {"", "Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"};
            int ay_idx = now.month;
            if (ay_idx < 1 || ay_idx > 12) ay_idx = 1;
            
            char buf[32];
            snprintf(buf, sizeof(buf), "%02d %s %02d:%02d", now.day_of_month, aylar[ay_idx], now.hour, now.minute);
            return std::string(buf);
            
      - lambda: |-
          auto now = id(internet_saati).now();
          
          if (id(plan_aktif) && now.is_valid()) {
            if (now.hour == id(plan_saat) && now.minute == id(plan_dakika)) {
              ESP_LOGI("OTOMATIK_YEMLEME", "Ekran planı zamanı geldi! Yemleme başlatılıyor.");
              id(yemleme_script).execute();
            }
          }
          
          if (now.is_valid()) {
            if (id(yemleme_1_aktif).state && now.hour == 8 && now.minute == 0) {
              ESP_LOGI("OTOMATIK_YEMLEME", "Sabit Plan 1 zamanı geldi!");
              id(yemleme_script).execute();
            }
            if (id(yemleme_2_aktif).state && now.hour == 19 && now.minute == 0) {
              ESP_LOGI("OTOMATIK_YEMLEME", "Sabit Plan 2 zamanı geldi!");
              id(yemleme_script).execute();
            }
            if (id(yemleme_3_aktif).state && now.hour == 22 && now.minute == 0) {
              ESP_LOGI("OTOMATIK_YEMLEME", "Sabit Plan 3 zamanı geldi!");
              id(yemleme_script).execute();
            }
          }

# ============================================================
# RGB LED
# ============================================================
light:
  - platform: esp32_rmt_led_strip
    name: "RGB LED"
    id: rgb_led
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    effects:
      - pulse:
          name: slow_pulse
          transition_length: 1s
          update_interval: 2s

  - platform: lvgl
    name: "Plan Aktif LED Işığı"
    id: plan_aktif_isik
    widget: plan_aktif_led

  - platform: monochromatic
    output: tft_led
    name: "Ekran Parlaklığı"
    id: ekran_arka_isigi
    restore_mode: ALWAYS_ON
# ============================================================
# Global Değişkenler
# ============================================================  
globals:
  - id: feeding_now
    type: bool
    restore_value: no
    initial_value: "false"
  - id: servo_mac
    type: uint8_t[6]
    restore_value: no
    initial_value: "{0x00, 0x00, 0x00, 0x00, 0x00, 0x00}"
  - id: ekran_bos_saniye
    type: int
    restore_value: no
    initial_value: "0"
  - id: secili_plan
    type: int
    restore_value: no
    initial_value: "1"
  - id: sistem_hazir
    type: bool
    restore_value: no
    initial_value: "false"

  - id: boot_yuzde
    type: int
    restore_value: no
    initial_value: "0"

  - id: son_yemleme_saati
    type: std::string
    restore_value: yes
    initial_value: '"--:--"'

  - id: yem_seviyesi_yuzde
    type: int
    restore_value: no
    initial_value: "72"

  - id: plan_saat
    type: int
    restore_value: yes
    initial_value: "8"

  - id: plan_dakika
    type: int
    restore_value: yes
    initial_value: "0"

  - id: plan_aktif
    type: bool
    restore_value: yes
    initial_value: "false"

number:
  - platform: template
    name: "Servo Açısı"
    id: servo_acisi
    optimistic: true
    min_value: -100
    max_value: 100
    step: 1
    initial_value: 92
    restore_value: true

  - platform: template
    name: "Yemleme Kapağı Açısı"
    id: num_servo_aci
    icon: "mdi:angle-acute"
    min_value: -100
    max_value: 100
    step: 5
    initial_value: 92
    unit_of_measurement: "%"
    mode: slider
    # Arayüzden açı değiştirildiğinde anında ESP-NOW ile Slave'e iletir
    set_action:
      then:
        - espnow.send:
            address: !secret servo_mac_address
            data: !lambda |-
              int8_t aci_degeri = (int8_t)x;
              return {0x02, (uint8_t)aci_degeri};
        - logger.log:
            format: "SERVO_ACI_AYARLA (0x02) gönderildi. Yeni Değer: %.0f%%"
            args: [ x ] # 284; Doğru Satır (Tırnaklar kaldırıldı)

  - platform: template
    name: Ekran Bekleme Süresi
    optimistic: true
    id: ekran_bekleme_suresi
    unit_of_measurement: "s"
    initial_value: 30
    restore_value: true
    min_value: 10
    max_value: 300
    step: 5
    mode: box
  
  - platform: template
    name: "Ekran Parlaklığı"
    id: ekran_parlakligi
    optimistic: true
    restore_value: true
    min_value: 10   # En düşük %10 (0 yapılması engellendi)
    max_value: 100  # En yüksek %100
    step: 10        # Her basışta %10 değişsin
    initial_value: 80
    on_value:
      then:
        - light.turn_on:
            id: ekran_arka_isigi
            brightness: !lambda 'return x / 100.0;' # % değerini 0.1 - 1.0 arasına çevirir

switch:
  - platform: template
    name: "Yemleme 1 Aktif"
    id: yemleme_1_aktif
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Yemleme 2 Aktif"
    id: yemleme_2_aktif
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Yemleme 3 Aktif"
    id: yemleme_3_aktif
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    
datetime:
  - platform: template
    id: yemleme_sira_1
    name: "Yemleme 1"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "08:00:00"

  - platform: template
    id: yemleme_sira_2
    name: "Yemleme 2"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "19:00:00"

  - platform: template
    id: yemleme_sira_3
    name: "Yemleme 3"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
# ============================================================
# DOKUNMATİK EKRAN (XPT2046)
# ============================================================
touchscreen:
  platform: xpt2046
  id: ekranim_touch
  cs_pin: GPIO15
  spi_id: tft_spi
  interrupt_pin: GPIO16
  update_interval: 500ms
  transform:
    mirror_x: false
    mirror_y: true
  calibration:
    x_min: 450
    x_max: 3500
    y_min: 550
    y_max: 3770
  on_release:
    - if:
        condition:
          lambda: 'return !id(feeding_now);'
        then:
          - if:
              condition: lvgl.is_paused
              then:
                - lvgl.resume:
    
# ============================================================
# DS18B20
# ============================================================
one_wire:
  - platform: gpio
    pin: GPIO4

# ============================================================
# SENSÖRLER
# ============================================================
sensor:
  - platform: dallas_temp
    name: "Water Temperature"
    id: water_temp
    update_interval: 2s
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(feeding_now);'
            then:
              - lvgl.label.update:
                  id: water_temp_value
                  text:
                    format: "%.1f"
                    args: ['x']

  - platform: vl53l0x
    name: "Yem Seviyesi Sensörü"
    address: 0x29
    i2c_id: saat_tutucu
    update_interval: 5s
    long_range: false
    timeout: 100ms
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    filters:
      - filter_out: nan
      - multiply: 1000.0
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - throttle_average: 30s
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(feeding_now);'
            then:
              - lvgl.label.update:
                  id: distance_value
                  text:
                    format: "%.0f mm"
                    args: ['x']
  # 1. Ham Voltajı Okuyan ve Gerçek Pil Voltajına Dönüştüren Sensör
  - platform: adc
    pin: GPIO2
    name: "Pil Voltajı"
    id: pil_voltaji
    update_interval: 10s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      # Voltaj bölücü kalibrasyonu: 
      # Analog pinden okunan ~1.04V değerini gerçek pil voltajı olan 4.2V'a çarpma yöntemiyle yükseltiyoruz.
      # Üstteki direnç formülüne göre çarpanımız yaklaşık (100+33)/33 = 4.03'tür.
      - multiply: 4.03

  # 2. Voltaj Değerini Yüzdeye (%) Dönüştüren Şablon Sensör
  - platform: template
    name: "Pil Yüzdesi"
    id: pil_yuzdesi
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery"
    lambda: |-
      // Pil voltajını alıyoruz
      float voltage = id(pil_voltaji).state;
      
      // Eğer sensör henüz okunmadıysa orayı pas geç
      if (isnan(voltage)) return {};

      // Lityum pil için sınır değerleri (4.2V = %100 , 3.3V = %0)
      float max_v = 4.2;
      float min_v = 3.3;

      // Voltajı yüzdeye oranla
      float percentage = ((voltage - min_v) / (max_v - min_v)) * 100.0;

      // Sonucun %0 ile %100 arasında kalmasını sağla (taşmaları engelle)
      if (percentage > 100.0) percentage = 100.0;
      if (percentage < 0.0) percentage = 0.0;

      return percentage;

  - platform: template
    name: "Serbest RAM"
    id: free_heap_mb
    unit_of_measurement: "MB"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      return esp_get_free_heap_size() / 1024.0 / 1024.0;
# Not: ESP-IDF üzerinde PSRAM için heap_caps_get_free_size(MALLOC_CAP_SPIRAM) da kullanılabilir.
  - platform: template
    name: "Serbest PSRAM"
    id: free_psram_mb
    unit_of_measurement: "MB"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      return esp_get_free_internal_heap_size() / 1024.0 / 1024.0;  
      
  - platform: uptime
    name: "Uptime Sensor"
    id: uptime_sensor_seconds
    entity_category: diagnostic
    internal: true

  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 30s

  - platform: copy
    source_id: wifi_rssi
    id: wifi_signal_percent
    name: "WiFi Sinyal"
    filters: 
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""

# ============================================================
# TFT EKRAN (ILI9341)
# ============================================================
display:
  - platform: mipi_spi
    model: ILI9341
    cs_pin: GPIO10
    dc_pin: GPIO9
    id: ekranim
    reset_pin: GPIO14
    spi_id: tft_spi
    rotation: 0°
    dimensions:
      width: 240
      height: 320
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never

# ============================================================
# METİN SENSÖRLER
# ============================================================
text_sensor:
  - platform: template
    name: "Cihaz MAC Adresi"
    id: mac_sensor
    update_interval: 1s
    lambda: |-
      return get_mac_address_pretty();
    on_value:
      then:
        - logger.log:
            format: "Ana ESP32 MAC Adresi: %s"
            args: [ 'x.c_str()' ]

  - platform: template
    name: "Sonraki Yemleme"
    id: sonraki_yemleme
    icon: "mdi:clock-outline"
    update_interval: 15s
    lambda: |-
      auto now = id(internet_saati).now();
      if (!now.is_valid()) return std::string("Senkron...");
      
      int current_minute = now.hour * 60 + now.minute;
      int feed1 = id(yemleme_1_aktif).state ? 8 * 60 + 0 : -1;
      int feed2 = id(yemleme_2_aktif).state ? 19 * 60 + 0 : -1;
      int feed3 = id(yemleme_3_aktif).state ? 22 * 60 + 0 : -1;
      
      int next_feed = -1;
      if (feed1 > current_minute) next_feed = feed1;
      if (feed2 > current_minute && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
      if (feed3 > current_minute && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
      
      if (next_feed == -1) {
        if (feed1 != -1) next_feed = feed1;
        if (feed2 != -1 && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
        if (feed3 != -1 && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
      }
      
      if (next_feed == -1) return std::string("Yok");
      
      char buffer[16];
      snprintf(buffer, sizeof(buffer), "%02d:%02d", next_feed / 60, next_feed % 60);
      return std::string(buffer);

  - platform: template
    name: "Sonraki Yemleme Hesaplayıcı"
    id: sonraki_yemleme_hesapla
    update_interval: 15s
    lambda: |-
      auto now = id(internet_saati).now();
      if (!now.is_valid()) return std::string("--:--");
      
      int current_minute = now.hour * 60 + now.minute;
      int feed1 = id(yemleme_1_aktif).state ? 8 * 60 + 0 : -1;
      int feed2 = id(yemleme_2_aktif).state ? 19 * 60 + 0 : -1;
      int feed3 = id(yemleme_3_aktif).state ? 22 * 60 + 0 : -1;
      
      int next_feed = -1;
      if (feed1 > current_minute) next_feed = feed1;
      if (feed2 > current_minute && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
      if (feed3 > current_minute && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
      
      if (next_feed == -1) {
        if (feed1 != -1) next_feed = feed1;
        if (feed2 != -1 && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
        if (feed3 != -1 && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
      }
      
      if (next_feed == -1) return std::string("Yok");
      
      char buffer[16];
      snprintf(buffer, sizeof(buffer), "%02d:%02d", next_feed / 60, next_feed % 60);
      return std::string(buffer);
  - platform: template
    name: "Yemleme Döngüsü"
    id: yemleme_dongusu
    update_interval: 10s
    lambda: |-
      int total = (id(yemleme_1_aktif).state ? 1 : 0) + (id(yemleme_2_aktif).state ? 1 : 0) + (id(yemleme_3_aktif).state ? 1 : 0);
      char buffer[4];
      sprintf(buffer, "Günde %d Kez", total);
      return std::string(buffer);
  - platform: uptime
    id: uptime_sensor_text
    name: Uptime
    format:
      separator: " "
      days: " Gün"
      hours: " Saat"
      minutes: " Dakika"
      seconds: " saniye"
    update_interval: 1s
    icon: mdi:clock-start
  - platform: wifi_info
    ip_address:
      name: "IP Adresi"
      id: wifi_ip
binary_sensor:
  - platform: status
    name: "Balık Yemleyici"
    id: wifi_status

  - platform: gpio
    pin:
      number: GPIO7
      mode: INPUT
    name: "Şebeke Gücü"
    id: sebeke_gucu
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_press:
      then:
        - logger.log: "ELEKTRİK GELDİ: Adaptör Modu"
        # Ekrandaki ikonu yeşil priz yapar
        - lvgl.label.update:
            id: header_power_icon
            text: "\U000F1C3B"
            text_color: 0x10B981
    on_release:
      then:
        - logger.log: "ELEKTRİK KESİLDİ: Batarya Modu!"
        # Ekrandaki ikonu kırmızı/turuncu pil yapar
