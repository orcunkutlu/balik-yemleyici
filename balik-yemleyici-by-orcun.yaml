# ============================================================
# METİN SENSÖRLER
# ============================================================
text_sensor:
  - platform: template
    name: "Son Yemleme"
    id: son_yemleme_ha
    web_server:
      sorting_group_id: group_status
      sorting_weight: 50
    icon: "mdi:fishbowl-outline"
    update_interval: 10s
    lambda: |-
      return id(son_yemleme_saati);
  - platform: template
    name: "Sonraki Yemleme"
    id: sonraki_yemleme
    web_server:
      sorting_group_id: group_status
      sorting_weight: 60
    icon: "mdi:calendar-clock"
    update_interval: 10s
    lambda: |-
      ESPTime now;
      if (id(internet_saati).now().is_valid()) {
        now = id(internet_saati).now();
      } else if (id(rtc_saati).now().is_valid()) {
        now = id(rtc_saati).now();
      } else {
        return std::string("Zaman Bekleniyor...");
      }
      // Şu anki zamanı gece yarısından itibaren toplam dakika cinsine çeviriyoruz
      int simdi_dk = now.hour * 60 + now.minute;
      int en_yakin_fark = 9999;
      std::string sonraki_plan_adi = "";
      int hedef_saat = 0, hedef_dakika = 0;
      bool herhangi_biri_aktif = false;
      // ---- PLAN 1 KONTROL ----
      if (id(yemleme_1_aktif).state) {
        herhangi_biri_aktif = true;
        int p1_dk = id(yemleme_sira_1).hour * 60 + id(yemleme_sira_1).minute;
        int fark = p1_dk - simdi_dk;
        if (fark <= 0) fark += 1440; // Eğer saat geçtiyse yarına at (1440 dk = 24 saat)
        if (fark < en_yakin_fark) {
          en_yakin_fark = fark;
          sonraki_plan_adi = "Plan 1";
          hedef_saat = id(yemleme_sira_1).hour;
          hedef_dakika = id(yemleme_sira_1).minute;
        }
      }
      // ---- PLAN 2 KONTROL ----
      if (id(yemleme_2_aktif).state) {
        herhangi_biri_aktif = true;
        int p2_dk = id(yemleme_sira_2).hour * 60 + id(yemleme_sira_2).minute;
        int fark = p2_dk - simdi_dk;
        if (fark <= 0) fark += 1440;
        if (fark < en_yakin_fark) {
          en_yakin_fark = fark;
          sonraki_plan_adi = "Plan 2";
          hedef_saat = id(yemleme_sira_2).hour;
          hedef_dakika = id(yemleme_sira_2).minute;
        }
      }
      // ---- PLAN 3 KONTROL ----
      if (id(yemleme_3_aktif).state) {
        herhangi_biri_aktif = true;
        int p3_dk = id(yemleme_sira_3).hour * 60 + id(yemleme_sira_3).minute;
        int fark = p3_dk - simdi_dk;
        if (fark <= 0) fark += 1440;
        if (fark < en_yakin_fark) {
          en_yakin_fark = fark;
          sonraki_plan_adi = "Plan 3";
          hedef_saat = id(yemleme_sira_3).hour;
          hedef_dakika = id(yemleme_sira_3).minute;
        }
      }
      if (!herhangi_biri_aktif) {
        return std::string("Yemleme Kapalı! Aktif Plan Yok");
      }
      // Ekrana basılacak format: "Plan 1 (08:30)"
      char buf[32];
      snprintf(buf, sizeof(buf), "%s (%02d:%02d)", sonraki_plan_adi.c_str(), hedef_saat, hedef_dakika);
      return std::string(buf);
  - platform: template
    name: "Yemleme Döngüsü"
    id: yemleme_dongusu
    web_server:
      sorting_group_id: group_schedule
      sorting_weight: 70
    icon: "mdi:repeat"
    update_interval: 10s
    lambda: |-
      int total = (id(yemleme_1_aktif).state ? 1 : 0) + (id(yemleme_2_aktif).state ? 1 : 0) + (id(yemleme_3_aktif).state ? 1 : 0);
      char buffer[4];
      sprintf(buffer, "Günde %d Kez", total);
      return std::string(buffer);
  - platform: uptime
    id: uptime_sensor_text
    name: Çalışma Süresi
    web_server:
      sorting_group_id: group_system
      sorting_weight: 20
    format:
      separator: " "
      days: " Gün"
      hours: " Saat"
      minutes: " Dakika"
      seconds: " saniye"
    update_interval: 60s
    icon: mdi:clock-start
  - platform: wifi_info
    ip_address:
      name: "IP Adresi"
      id: wifi_ip
      web_server:
        sorting_group_id: group_system
        sorting_weight: 30
      icon: "mdi:ip-network"
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_info_ip
              text: !lambda |-
                if (x.empty()) {
                  return "Çevrimdışı";
                } else {
                  return x.c_str();
                }
binary_sensor:
  - platform: status
    name: "Balık Yemleyici"
    id: wifi_status
    web_server:
      sorting_group_id: group_system
      sorting_weight: 10
    icon: "mdi:access-point-check"
    on_state:
      then:
        - lvgl.label.update:
            id: lbl_info_ip
            text: !lambda |-
              if (id(wifi_status).state) {
                return id(wifi_ip).state.c_str();
              } else {
                return "Çevrimdışı";
              }

  - platform: gpio
    pin:
      number: GPIO7
      mode: INPUT
      inverted: true
    name: "Batarya Modu"
    web_server:
      sorting_group_id: group_status
      sorting_weight: 70
    id: batarya_modu
    icon: "mdi:battery-clock"
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_press:
      then:
        - logger.log: "ELEKTRİK KESİLDİ: Batarya Modu!"
        # Ekrandaki ikonu kırmızı/turuncu pil yapar
        - lvgl.label.update:
            id: header_power_icon
            text: "\U000F0079"
            text_color: 0xEF4444 # (Batarya modu)
        - script.execute: guncelle_pil_yuzdesi
    on_release:
      then:
        - logger.log: "Adaptör Modu"
        # Ekrandaki ikonu yeşil priz yapar
        - lvgl.label.update:
            id: header_power_icon
            text: "\U000F1C3C"
            text_color: 0x10B981
        - lvgl.label.update:
            id: pil_durum_icon
            text: "\U000F1C3C"      # mdi:power-plug-battery-outline
            text_color: 0x10B981
        - lvgl.label.update:
            id: pil_durum_value
            text: "USB"


