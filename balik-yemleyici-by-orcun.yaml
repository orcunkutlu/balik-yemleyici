script:
  - id: yemleme_script
    mode: single
    then:
      - lvgl.resume:
      - light.turn_on: ekran_arka_isigi
      - lambda: |-
          id(feeding_now) = true;

      - light.turn_on:
          id: rgb_led
          blue: 100%

      - servo.write:
          id: yemleyici_servo
          level: -100%

      - delay: 300ms

      - servo.write:
          id: yemleyici_servo
          level: !lambda "return id(servo_acisi).state / 100.0;"

      - delay: 1000ms

      - servo.write:
          id: yemleyici_servo
          level: -100%

      - delay: 500ms

      - servo.write:
          id: yemleyici_servo
          level: -70%

      - delay: 150ms

      - servo.write:
          id: yemleyici_servo
          level: -100%

      - delay: 150ms

      - servo.detach: yemleyici_servo

      - light.turn_off: rgb_led

      - lambda: |-
          id(feeding_now) = false;
          auto now = id(internet_saati).now();

          if (!now.is_valid())
            return;

          char buffer[6];
          sprintf(
            buffer,
            "%02d:%02d",
            now.hour,
            now.minute
          );
          id(son_yemleme_saati) = buffer;

interval:
  - interval: 1s
    then:
      # 1. Ana Ekran Verilerini Canlandırma
      - lvgl.label.update:
          id: clock_value
          text:
            format: "%s"
            args: ['id(internet_saati).now().strftime("%H:%M").c_str()']

      - lvgl.label.update:
          id: txt_plan_hour
          text: !lambda |-
            int h = 0;
            if (id(secili_plan) == 1) h = id(yemleme_sira_1).hour;
            else if (id(secili_plan) == 2) h = id(yemleme_sira_2).hour;
            else h = id(yemleme_sira_3).hour;
            char buf[4];
            sprintf(buf, "%02d", h);
            return std::string(buf);

      - lvgl.label.update:
          id: txt_plan_min
          text: !lambda |-
            int m = 0;
            if (id(secili_plan) == 1) m = id(yemleme_sira_1).minute;
            else if (id(secili_plan) == 2) m = id(yemleme_sira_2).minute;
            else m = id(yemleme_sira_3).minute;
            char buf[4];
            sprintf(buf, "%02d", m);
            return std::string(buf);

      # Buton Metnini Dinamik Güncelleme (AÇ / KAPAT)
      - lvgl.label.update:
          id: txt_plan_status_btn
          text: !lambda |-
            bool aktif = false;
            if (id(secili_plan) == 1) aktif = id(yemleme_1_aktif).state;
            else if (id(secili_plan) == 2) aktif = id(yemleme_2_aktif).state;
            else if (id(secili_plan) == 3) aktif = id(yemleme_3_aktif).state;
            return aktif ? "KAPAT" : "AÇ";

      # Yeşil LED Durum Göstergesini Canlandırma
      - if:
          condition:
            lambda: |-
              if (id(secili_plan) == 1) return id(yemleme_1_aktif).state;
              if (id(secili_plan) == 2) return id(yemleme_2_aktif).state;
              return id(yemleme_3_aktif).state;
          then: 
            - light.turn_on: plan_aktif_isik
          else: 
            - light.turn_off: plan_aktif_isik
      - lvgl.label.update:
          id: uptime_value
          text: !lambda |-
            return id(uptime_sensor_text).state;
      # Tesis edilen tüm planları kontrol edip sıradaki en yakın olanı ekrana basar
      - lvgl.label.update:
          id: next_feed_value
          text: !lambda |-
            if (id(plan_aktif)) {
              char buf[16];
              snprintf(buf, sizeof(buf), "%02d:%02d", id(plan_saat), id(plan_dakika));
              return std::string(buf);
            } else {
              return std::string("--:--");
            }

      - lvgl.label.update:
          id: last_feed_value
          text:
            format: "%s"
            args: ['id(son_yemleme_saati).c_str()']

  - interval: 30s
    then:
      - lambda: |-
          auto rtc = id(rtc_saati).now();
          auto sntp = id(internet_saati).now();
          if (sntp.is_valid()) {
            ESP_LOGI("SISTEM", "Zaman Senkronize.");
          }
  - interval: 60s
    then:
      # Dinamik Türkçe Ay ismi formatlama (Jun yerine Haz yazar)
      - lvgl.label.update:
          id: header_datetime
          text: !lambda |-
            auto now = id(internet_saati).now();
            if (!now.is_valid()) return std::string("Zaman Bekleniyor");
            
            // Türkçe ay isimleri dizisi (Oca=1, Şub=2... Ara=12 şeklinde eşleşir)
            const char* aylar[] = {"", "Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"};
            int ay_idx = now.month;
            if (ay_idx < 1 || ay_idx > 12) ay_idx = 1;
            
            char buf[32];
            snprintf(buf, sizeof(buf), "%02d %s %02d:%02d", now.day_of_month, aylar[ay_idx], now.hour, now.minute);
            return std::string(buf);
            
      - lambda: |-
          auto now = id(internet_saati).now();
          
          // Ekrardan Ayarlanan Özel Plan Kontrolü
          if (id(plan_aktif) && now.is_valid()) {
            if (now.hour == id(plan_saat) && now.minute == id(plan_dakika)) {
              ESP_LOGI("OTOMATIK_YEMLEME", "Ekran planı zamanı geldi! Yemleme başlatılıyor.");
              id(yemleme_script).execute();
            }
          }
          
          // 3 Sabit Zamanlı Plan Kontrolü (08:00, 19:00, 22:00)
          if (now.is_valid()) {
            if (id(yemleme_1_aktif).state && now.hour == 8 && now.minute == 0) {
              ESP_LOGI("OTOMATIK_YEMLEME", "Sabit Plan 1 zamanı geldi!");
              id(yemleme_script).execute();
            }
            if (id(yemleme_2_aktif).state && now.hour == 19 && now.minute == 0) {
              ESP_LOGI("OTOMATIK_YEMLEME", "Sabit Plan 2 zamanı geldi!");
              id(yemleme_script).execute();
            }
            if (id(yemleme_3_aktif).state && now.hour == 22 && now.minute == 0) {
              ESP_LOGI("OTOMATIK_YEMLEME", "Sabit Plan 3 zamanı geldi!");
              id(yemleme_script).execute();
            }
          }

# ============================================================
# RGB LED
# ============================================================
light:
  - platform: esp32_rmt_led_strip
    name: "RGB LED"
    id: rgb_led
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    effects:
      - pulse:
          name: slow_pulse
          transition_length: 1s
          update_interval: 2s

  - platform: lvgl
    name: "Plan Aktif LED Işığı"
    id: plan_aktif_isik
    widget: plan_aktif_led

  - platform: monochromatic
    output: tft_led
    name: "Ekran Parlaklığı"
    id: ekran_arka_isigi
    restore_mode: ALWAYS_ON
# ============================================================
# Global Değişkenler
# ============================================================  
globals:
  - id: feeding_now
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ekran_bos_saniye
    type: int
    restore_value: no
    initial_value: "0"
  - id: secili_plan
    type: int
    restore_value: no
    initial_value: "1"
  - id: sistem_hazir
    type: bool
    restore_value: no
    initial_value: "false"

  - id: boot_yuzde
    type: int
    restore_value: no
    initial_value: "0"

  - id: son_yemleme_saati
    type: std::string
    restore_value: yes
    initial_value: '"--:--"'

  - id: yem_seviyesi_yuzde
    type: int
    restore_value: no
    initial_value: "72"

  - id: plan_saat
    type: int
    restore_value: yes
    initial_value: "8"

  - id: plan_dakika
    type: int
    restore_value: yes
    initial_value: "0"

  - id: plan_aktif
    type: bool
    restore_value: yes
    initial_value: "false"

number:
  - platform: template
    name: "Servo Açısı"
    id: servo_acisi
    optimistic: true
    min_value: -100
    max_value: 100
    step: 1
    initial_value: 92
    restore_value: true

  - platform: template
    name: Ekran Bekleme Süresi
    optimistic: true
    id: ekran_bekleme_suresi
    unit_of_measurement: "s"
    initial_value: 30
    restore_value: true
    min_value: 10
    max_value: 300
    step: 5
    mode: box

switch:
  - platform: template
    name: "Yemleme 1 Aktif"
    id: yemleme_1_aktif
    optimistic: true

  - platform: template
    name: "Yemleme 2 Aktif"
    id: yemleme_2_aktif
    optimistic: true
  - platform: template
    name: "Yemleme 3 Aktif"
    id: yemleme_3_aktif
    optimistic: true
    
datetime:
  - platform: template
    id: yemleme_sira_1
    name: "Yemleme 1"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "08:00:00"

  - platform: template
    id: yemleme_sira_2
    name: "Yemleme 2"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "19:00:00"

  - platform: template
    id: yemleme_sira_3
    name: "Yemleme 3"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
# ============================================================
# DOKUNMATİK EKRAN (XPT2046)
# ============================================================
touchscreen:
  platform: xpt2046
  id: ekranim_touch
  cs_pin: GPIO15
  spi_id: tft_spi
  interrupt_pin: GPIO16
  update_interval: 50ms
  transform:
    mirror_x: false
    mirror_y: true
  calibration:
    x_min: 450
    x_max: 3500
    y_min: 550
    y_max: 3770
  on_release:
    - if:
        condition: lvgl.is_paused
        then:
          - logger.log: "LVGL resuming"
          - lvgl.resume:
          - lvgl.widget.redraw:
          - light.turn_on: ekran_arka_isigi
# ============================================================
# DS18B20
# ============================================================
one_wire:
  - platform: gpio
    pin: GPIO4

# ============================================================
# SENSÖRLER
# ============================================================
sensor:
  - platform: dallas_temp
    name: "Water Temperature"
    id: water_temp
    update_interval: 2s
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    on_value:
      then:
        - lvgl.label.update:
            id: water_temp_value
            text:
              format: "%.1f"
              args: ['x']
  - platform: vl53l0x
    name: "Yem Seviyesi Sensörü"
    address: 0x29
    i2c_id: saat_tutucu
    update_interval: 5s
    long_range: false
    timeout: 100ms
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    filters:
      - filter_out: nan
      - multiply: 1000.0
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - throttle_average: 30s
    on_value:
      then:
        - lvgl.label.update:
            id: distance_value
            text:
              format: "%.0f mm"
              args: ['x']
              
  - platform: uptime
    name: "Uptime Sensor"
    id: uptime_sensor_seconds
    entity_category: diagnostic
    internal: true

  - platform: template
    id: free_heap

  - platform: template
    id: free_psram

  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 30s
    on_value:
      then:
        - text_sensor.template.publish:
            id: wifi_ikonu
            state: !lambda |-
              if (x > -55) return std::string("1");
              if (x > -65) return std::string("2");
              if (x > -75) return std::string("3");
              return std::string("0");

  - platform: copy
    source_id: wifi_rssi
    id: wifi_signal_percent
    name: "WiFi Sinyal"
    filters: 
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""

# ============================================================
# TFT EKRAN (ILI9341)
# ============================================================
display:
  - platform: mipi_spi
    model: ILI9341
    cs_pin: GPIO10
    dc_pin: GPIO9
    id: ekranim
    reset_pin: GPIO14
    spi_id: tft_spi
    rotation: 0°
    dimensions:
      width: 240
      height: 320
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never

# ============================================================
# METİN SENSÖRLER
# ============================================================
text_sensor:
  - platform: template
    id: wifi_ikonu
  - platform: template
    name: "Sonraki Yemleme"
    id: sonraki_yemleme
    icon: "mdi:clock-outline"
    update_interval: 15s
    lambda: |-
      auto now = id(internet_saati).now();
      if (!now.is_valid()) return std::string("Senkron...");
      
      int current_minute = now.hour * 60 + now.minute;
      // Sabit saat planlarınız (08:00, 19:00, 22:00) dakikaya çevrildi
      int feed1 = id(yemleme_1_aktif).state ? 8 * 60 + 0 : -1;
      int feed2 = id(yemleme_2_aktif).state ? 19 * 60 + 0 : -1;
      int feed3 = id(yemleme_3_aktif).state ? 22 * 60 + 0 : -1;
      
      int next_feed = -1;
      if (feed1 > current_minute) next_feed = feed1;
      if (feed2 > current_minute && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
      if (feed3 > current_minute && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
      
      if (next_feed == -1) {
        if (feed1 != -1) next_feed = feed1;
        if (feed2 != -1 && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
        if (feed3 != -1 && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
      }
      
      if (next_feed == -1) return std::string("Yok");
      
      char buffer[16];
      snprintf(buffer, sizeof(buffer), "%02d:%02d", next_feed / 60, next_feed % 60);
      return std::string(buffer);

  - platform: template
    name: "Sonraki Yemleme Hesaplayıcı"
    id: sonraki_yemleme_hesapla
    update_interval: 15s
    lambda: |-
      auto now = id(internet_saati).now();
      if (!now.is_valid()) return std::string("--:--");
      
      int current_minute = now.hour * 60 + now.minute;
      int feed1 = id(yemleme_1_aktif).state ? 8 * 60 + 0 : -1;
      int feed2 = id(yemleme_2_aktif).state ? 19 * 60 + 0 : -1;
      int feed3 = id(yemleme_3_aktif).state ? 22 * 60 + 0 : -1;
      
      int next_feed = -1;
      if (feed1 > current_minute) next_feed = feed1;
      if (feed2 > current_minute && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
      if (feed3 > current_minute && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
      
      if (next_feed == -1) {
        if (feed1 != -1) next_feed = feed1;
        if (feed2 != -1 && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
        if (feed3 != -1 && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
      }
      
      if (next_feed == -1) return std::string("Yok");
      
      char buffer[16];
      snprintf(buffer, sizeof(buffer), "%02d:%02d", next_feed / 60, next_feed % 60);
      return std::string(buffer);
  - platform: template
    name: "Yemleme Döngüsü"
    id: yemleme_dongusu
    update_interval: 10s
    lambda: |-
      int total = (id(yemleme_1_aktif).state ? 1 : 0) + (id(yemleme_2_aktif).state ? 1 : 0) + (id(yemleme_3_aktif).state ? 1 : 0);
      char buffer[16];
      sprintf(buffer, "Günde %d Kez", total);
      return std::string(buffer);
  - platform: uptime
    id: uptime_sensor_text
    name: Uptime
    format:
      separator: " "
      days: " Gün"
      hours: " Saat"
      minutes: " Dakika"
      seconds: " saniye"
    update_interval: 1s
    icon: mdi:clock-start
  - platform: wifi_info
    ip_address:
      name: "IP Adresi"
      id: wifi_ip
binary_sensor:
  - platform: status
    name: "Balık Yemleyici"
    id: wifi_status