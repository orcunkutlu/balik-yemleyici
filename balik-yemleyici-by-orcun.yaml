# ============================================================
# LVGL SCRIPT
# ============================================================
lvgl:
  page_wrap: false
  buffer_size: 25%
  id: lvgl_id
  displays:
    - ekranim

  on_idle:
    timeout: !lambda |-
      return id(ekran_bekleme_suresi).state * 1000;

    then:
      - logger.log: "Ekran boşta kaldı"
      - light.turn_off: ekran_arka_isigi
      - lvgl.pause:

  theme:
    buttonmatrix:
      bg_color: 0x070E1B
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      items:
        bg_color: 0x070E1B
        bg_opa: 95%
        border_width: 0
        radius: 0
        pad_all: 0
        text_color: 0x8E9FB8      # Inactive (pasif) renk — gri-mavi
        # PRESSED (basılı anlık)
        pressed:
          bg_color: 0x0F172A
          bg_opa: COVER
        # CHECKED/ACTIVE (aktif sayfa) — ŞAHANE RENK
        checked:
          bg_color: 0x1E293B
          bg_opa: COVER
          text_color: 0xFBBF24     # Amber/Gold — aktif sayfa rengi ✨
    button:
        bg_color: 0x1976D2
        radius: 12
        text_color: 0xFFFFFF

  bottom_layer:
    bg_opa: 0%
    pad_all: 0
    widgets:
      - obj:
          id: navbar_container
          align: BOTTOM_MID
          x: 0
          y: 0
          width: 240
          height: 40
          bg_color: 0x070E1B
          bg_opa: 95%
          border_width: 0
          radius: 0
          pad_all: 0
          hidden: false # Alt barın görünmesi için varsayılanı false yaptık
          widgets:
            - buttonmatrix:
                id: footer_nav
                x: 0
                y: 0
                width: 240
                height: 40
                align: CENTER
                bg_color: 0x070E1B
                text_font: mdi_icons
                border_width: 0
                pad_all: 0
                pad_row: 0
                pad_column: 0
                one_checked: true
                rows:
                  - buttons:
                      - id: nav_home
                        text: "\U000F02DC"
                        width: 1
                        control:
                          checkable: true
                          checked: true
                        on_press:
                          then:
                            - lvgl.page.show: page_home
                            - lvgl.label.update: { id: header_title, text: "Ana Ekran" }
                            - lvgl.matrix.button.update: { id: nav_home, control: {checked: true} }
                            - lvgl.matrix.button.update: { id: nav_feed, control: {checked: false} }
                            - lvgl.matrix.button.update: { id: nav_log, control: {checked: false} }
                            - lvgl.matrix.button.update: { id: nav_set, control: {checked: false} }
                                
                      - id: nav_feed
                        text: "\U000F0198"
                        width: 1
                        control:
                          checkable: true
                        on_press:
                          then:
                            - lvgl.page.show: page_feed
                            - lvgl.label.update: { id: header_title, text: "Zamanlama Planı" }
                            - lvgl.matrix.button.update: { id: nav_home, control: {checked: false} }
                            - lvgl.matrix.button.update: { id: nav_feed, control: {checked: true} }
                            - lvgl.matrix.button.update: { id: nav_log, control: {checked: false} }
                            - lvgl.matrix.button.update: { id: nav_set, control: {checked: false} }
                                
                      - id: nav_log
                        text: "\U000F0C9E"
                        width: 1
                        control:
                          checkable: true
                        on_press:
                          then:
                            - lvgl.page.show: page_log
                            - lvgl.label.update: { id: header_title, text: "Sistem Kayıtları" }
                            - lvgl.matrix.button.update: { id: nav_home, control: {checked: false} }
                            - lvgl.matrix.button.update: { id: nav_feed, control: {checked: false} }
                            - lvgl.matrix.button.update: { id: nav_log, control: {checked: true} }
                            - lvgl.matrix.button.update: { id: nav_set, control: {checked: false} }
                                
                      - id: nav_set
                        text: "\U000F0493"
                        width: 1
                        control:
                          checkable: true
                        on_press:
                          then:
                            - lvgl.page.show: page_settings
                            - lvgl.label.update: { id: header_title, text: "Cihaz Ayarlar" }
                            - lvgl.matrix.button.update: { id: nav_home, control: {checked: false} }
                            - lvgl.matrix.button.update: { id: nav_feed, control: {checked: false} }
                            - lvgl.matrix.button.update: { id: nav_log, control: {checked: false} }
                            - lvgl.matrix.button.update: { id: nav_set, control: {checked: true} }

  # ÜST KATMAN - Bildirimler, popup ve header gibi her şeyin üstünde ezerek duracak yapılar
  top_layer:
    bg_opa: 0%
    pad_all: 0
    widgets:
      # GLOBAL HEADER
      - obj:
          id: hdr_shb_bar
          x: 0
          y: 0
          width: 240
          height: 42
          bg_color: 0x070E1B
          bg_opa: 95%
          border_width: 0
          radius: 0
          pad_all: 0
          widgets:
            - label:
                id: header_title
                x: 14
                y: 4
                width: 170
                height: 20
                text: "Ana Ekran"
                text_color: 0xF1F5F9
                text_align: LEFT
                long_mode: CLIP
                text_font: font_16
            - label:
                id: header_datetime
                x: 14
                y: 26
                width: 170
                height: 12
                text: "16 Haz 00:00"
                text_color: 0x8E9FB8
                text_font: font_12
            - label:
                id: header_wifi_icon
                x: 210
                y: 10
                width: 20
                height: 20
                text: "\U000F05AA"
                text_font: mdi_icons
                text_align: CENTER
                text_color: 0xEF4444
            - label:
                id: header_power_icon
                text: "\U000F1C3B"
                text_color: 0x10B981
                width: 20
                height: 20
                x: 180
                y: 10
                text_font: mdi_icons

      # BİLDİRİM KARTI (Yeniden isimlendirildi ve en üst katmanda güvene alındı)
      - obj:
          id: premium_feed_modal
          x: 0
          y: 0
          width: 240
          height: 320
          hidden: true
          bg_color: 0x000000
          bg_opa: 75%          # Tüm ana ekranı %75 siyahlıkla arkada bırakır (Premium odaklanma etkisi)
          border_width: 0
          radius: 0
          scrollbar_mode: "OFF"
          pad_all: 0
          widgets:
            - obj:
                align: CENTER
                x: 0
                y: -10
                width: 200
                height: 190
                bg_color: 0x070E1B   # Sizin projenin asil koyu laciverti
                border_width: 1
                border_color: 0x162038
                radius: 24           # Yumuşak yuvarlatılmış modern köşeler
                shadow_width: 20     # Kutu etrafında şık bir parlama efekti
                shadow_color: 0xFBBF24 # Sizin temadaki muazzam Amber/Gold rengi parıltı ✨
                shadow_opa: 25%
                pad_all: 0
                scrollbar_mode: "OFF"
                widgets:
                  # Büyük Boy İkon (Kodunuzda tanımlı mdi_icons_large kullanılıyor)
                  - label:
                      id: modal_icon
                      x: 0
                      y: 20
                      width: 200
                      height: 50
                      text: "\U000F0EF4" # mdi-fish (büyük balık ikonu)
                      text_font: mdi_icons_large
                      text_align: CENTER
                      text_color: 0xFBBF24 # Canlı Kehribar Rengi
                  
                  # Ana Başlık
                  - label:
                      id: modal_title
                      x: 10
                      y: 85
                      width: 180
                      height: 20
                      text: "Yemleme Yapılıyor"
                      text_color: 0xFFFFFF
                      text_font: font_14
                      text_align: CENTER
                  
                  # Durum/Alt Bilgi Yazısı
                  - label:
                      id: modal_subtitle
                      x: 10
                      y: 112
                      width: 180
                      height: 30
                      text: "Balıklar besleniyor,\nlütfen bekleyin..."
                      text_color: 0x8E9FB8
                      text_font: font_10
                      text_align: CENTER
                  - spinner:
                      id: modal_spinner
                      x: 0
                      y: 120
                      align: CENTER
                      width: 40
                      height: 40
                      spin_time: 1000ms    # Çemberin 1 tam tur dönme süresi
                      arc_length: 60       # Çember yayının uzunluğu (derece)
                      line_width: 3        # Çemberin çizgi kalınlığı
                      line_color: 0xFBBF24

  pages:
    - id: page_home
      bg_color: 0x111827
      pad_all: 0
      widgets:
        - obj:
            id: grid_screen
            x: 0
            y: 0
            width: 240
            height: 320
            bg_color: 0x08142D
            scrollbar_mode: "OFF"
            scroll_on_focus: false
            border_width: 0
            radius: 0
            pad_all: 0
            widgets:
              - obj:
                  id: water_temp_card
                  x: 4
                  y: 48
                  width: 110
                  height: 36
                  bg_color: 0x070E1B
                  bg_opa: 95%
                  border_width: 1
                  border_color: 0x162038
                  border_opa: 20%
                  radius: 16
                  shadow_width: 5
                  shadow_color: 0xF59E0B
                  shadow_opa: 35%
                  scrollbar_mode: "OFF"
                  pad_all: 0
                  widgets:
                    - label:
                        id: water_temp_icon
                        x: 6
                        y: 5
                        width: 24
