# ============================================================
# SCRIPTLER
# ============================================================
script:
  - id: espnow_yemleme_gonder
    mode: queued
    then:
      - espnow.send:
          address: !secret servo_mac_address
          data: [0x01]

  - id: espnow_servo_ayarla
    mode: queued
    then:
      - logger.log: "ESP-NOW: Servo açı ayarı gönderildi"
      - espnow.send:
          address: !secret servo_mac_address
          data: !lambda |-
            int8_t aci = (int8_t)id(servo_acisi).state;
            return {0x02, (uint8_t)aci};

  - id: espnow_uyku_modu
    mode: queued
    then:
      - logger.log: "ESP-NOW: Pil Kritik! Servo uyku moduna alındı"
      - espnow.send:
          address: !secret servo_mac_address
          data: [0x04]
  - id: yemleme_script
    mode: single
    then:
      - script.execute: espnow_yemleme_gonder
      - lambda: |-
          id(feeding_now) = true;
      - logger.log: "Yemleme işlemi başlatıldı..."
      - if:
          condition:
            - lvgl.is_paused
          then:
            - lvgl.resume:
            - light.turn_on: ekran_arka_isigi
            - delay: 100ms

      - light.turn_on:
          id: rgb_led
          blue: 100%
          red: 0%
          green: 0%
      - lvgl.widget.show: premium_feed_modal
      - delay: 1000ms
      - light.turn_off: rgb_led
      - delay: 100ms
      - lambda: |-
          id(feeding_now) = false;
          auto now = id(rtc_saati).now();
          if (!now.is_valid()) return;
          char buffer[6];
          sprintf(buffer, "%02d:%02d", now.hour, now.minute);
          id(son_yemleme_saati) = buffer;
          id(son_yemleme_ha).publish_state(id(son_yemleme_saati));
      - delay: 50ms
      - script.execute: yemleme_guncellemesi_ekran
      - lvgl.widget.hide: premium_feed_modal
      - logger.log: "Yemleme başarıyla tamamlandı."
  - id: plan_isigi_guncelle
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              if (id(secili_plan) == 1) return id(yemleme_1_aktif).state;
              if (id(secili_plan) == 2) return id(yemleme_2_aktif).state;
              return id(yemleme_3_aktif).state;
          then: 
            - light.turn_on:
                id: plan_aktif_isik
                red: 0%      
                green: 100%  
                blue: 0%     
          else: 
            - light.turn_off: plan_aktif_isik
  - id: akilli_yemleme_kontrolu
    mode: single
    then:
      - lambda: |-
          static int son_kontrol_dakikasi = -1;
          
          ESPTime aktif_saat;
          
          // Öncelik internet saati, yoksa yedek RTC saati
          if (id(internet_saati).now().is_valid()) {
            aktif_saat = id(internet_saati).now();
          } else if (id(rtc_saati).now().is_valid()) {
            aktif_saat = id(rtc_saati).now();
          } else {
            return; // İki saat de henüz hazır değilse çık
          }

          // Sadece dakika değiştiğinde içeri gir (Aynı dakika içinde mükerrer yemlemeyi önler)
          if (aktif_saat.minute != son_kontrol_dakikasi) {
            son_kontrol_dakikasi = aktif_saat.minute;
            
            ESP_LOGD("ZAMAN_MOTORU", "Yeni dakika kontrolü yapılıyor: %02d:%02d", aktif_saat.hour, aktif_saat.minute);

            // 1. Plan Kontrolü
            if (id(yemleme_1_aktif).state && 
                aktif_saat.hour == id(yemleme_sira_1).hour && 
                aktif_saat.minute == id(yemleme_sira_1).minute) {
              ESP_LOGI("Plan 1 Aktif", "Yemleniyor! Saat: %02d:%02d", id(yemleme_sira_1).hour, id(yemleme_sira_1).minute);
              id(yemleme_script).execute();
            }
            
            // 2. Plan Kontrolü
            if (id(yemleme_2_aktif).state && 
                aktif_saat.hour == id(yemleme_sira_2).hour && 
                aktif_saat.minute == id(yemleme_sira_2).minute) {
              ESP_LOGI("Plan 2 Aktif", "Yemleniyor! Saat: %02d:%02d", id(yemleme_sira_2).hour, id(yemleme_sira_2).minute);
              id(yemleme_script).execute();
            }
            
            // 3. Plan Kontrolü
            if (id(yemleme_3_aktif).state && 
                aktif_saat.hour == id(yemleme_sira_3).hour && 
                aktif_saat.minute == id(yemleme_sira_3).minute) {
              ESP_LOGI("Plan 3 Aktif", "Yemleniyor! Saat: %02d:%02d", id(yemleme_sira_3).hour, id(yemleme_sira_3).minute);
              id(yemleme_script).execute();
            }
          }
  - id: yemleme_guncellemesi_ekran
    mode: single
    then:
      - lvgl.label.update:
          id: son_yemleme_value
          text:
            format: "%s"
            args: ['id(son_yemleme_saati).c_str()']
      - lvgl.label.update:
          id: siradaki_yem_value
          text: !lambda |-
            ESPTime time_now;
            if (id(internet_saati).now().is_valid()) {
              time_now = id(internet_saati).now();
            } else if (id(rtc_saati).now().is_valid()) {
              time_now = id(rtc_saati).now();
            } else {
              return std::string("--:--");
            }

            int current_minute = time_now.hour * 60 + time_now.minute;
            int feed1 = id(yemleme_1_aktif).state ? id(yemleme_sira_1).hour * 60 + id(yemleme_sira_1).minute : -1;
            int feed2 = id(yemleme_2_aktif).state ? id(yemleme_sira_2).hour * 60 + id(yemleme_sira_2).minute : -1;
            int feed3 = id(yemleme_3_aktif).state ? id(yemleme_sira_3).hour * 60 + id(yemleme_sira_3).minute : -1;
            
            int next_feed = -1;
            if (feed1 > current_minute) next_feed = feed1;
            if (feed2 > current_minute && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
            if (feed3 > current_minute && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
            
            // Bugün için saat geçtiyse yarının en erken planını göster
            if (next_feed == -1) {
              if (feed1 != -1) next_feed = feed1;
              if (feed2 != -1 && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
              if (feed3 != -1 && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
            }
            
            if (next_feed == -1) return std::string("Yok");
            
            char buffer[16];
            snprintf(buffer, sizeof(buffer), "%02d:%02d", next_feed / 60, next_feed % 60);
            return std::string(buffer);

  - id: guncelle_pil_yuzdesi
    mode: single
    then:
      - sensor.template.publish:
          id: pil_yuzdesi
          state: !lambda |-
            float voltage = id(pil_voltaji).state;
            if (isnan(voltage)) return 0.0;
            float max_v = 4.2;
            float min_v = 3.3;
            float percentage = ((voltage - min_v) / (max_v - min_v)) * 100.0;
            if (percentage > 100.0) percentage = 100.0;
            if (percentage < 0.0) percentage = 0.0;
            return percentage;

# ============================================================
# INTERVAL
# ============================================================
interval:
  - interval: 1s
    then:
      - script.execute: akilli_yemleme_kontrolu
  - interval: 10s
    then:
      - lvgl.label.update:
          id: header_datetime
          text: !lambda |-
            ESPTime aktif_saat;
            std::string kaynak = "";
            
            if (id(internet_saati).now().is_valid()) {
              aktif_saat = id(internet_saati).now();
              kaynak = "NTP";
            } else if (id(rtc_saati).now().is_valid()) {
              aktif_saat = id(rtc_saati).now();
              kaynak = "RTC";
            } else {
              return std::string("Zaman Bekleniyor...");
            }
            
            const char* aylar[] = {"", "Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"};
            int ay_idx = aktif_saat.month;
            if (ay_idx < 1 || ay_idx > 12) ay_idx = 1;
            
            char buf[40];
            // Ekranda şu şekilde görünecek: "16 Haz 00:00 [NTP]" veya "16 Haz 00:00 [RTC]"
            snprintf(buf, sizeof(buf), "%02d %s %02d:%02d [%s]", 
                     aktif_saat.day_of_month, aylar[ay_idx], aktif_saat.hour, aktif_saat.minute, kaynak.c_str());
            return std::string(buf);
