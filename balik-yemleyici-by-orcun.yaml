# Board: Espressif ESP32-S3-DevKitC-1-N16R8V (16 MB Flash Quad, 8 MB PSRAM Octal)
# Definition: definitions/boards/esp32-s3-devkitc1-n16r8/manifest.yaml

esphome:
  name: balik-yemleyici-by-orcun
  friendly_name: "Balık Yemleyici By Orçun"
  on_boot:
    priority: -100
    then:
      - lvgl.widget.hide: navbar_container
      - lvgl.widget.hide: hdr_shb_bar
      - lvgl.page.show: page_boot
      - switch.turn_on: yemleme_1_aktif
      - switch.turn_on: yemleme_2_aktif
      - switch.turn_off: yemleme_3_aktif

      - delay: 1.5s
      - lvgl.bar.update:
          id: boot_progress_bar
          value: 35
      - lvgl.label.update:
          id: lbl_boot_wifi
          text: "Wi-Fi Bağlandı! (OK)"
          text_color: 0x10B981

      - delay: 1.5s
      - lvgl.bar.update:
          id: boot_progress_bar
          value: 70
      - lvgl.label.update:
          id: lbl_boot_rtc
          text: "DS3231 Zaman Senkronize"
          text_color: 0x10B981

      # 4.5. Saniye: Sistem Hazırlığı Tamamlanıyor
      - delay: 1.5s
      - lvgl.bar.update:
          id: boot_progress_bar
          value: 100
      - lvgl.label.update:
          id: lbl_boot_sys
          text: "Sistem Hazır. Başlatılıyor..."
          text_color: 0xF59E0B  # Amber rengine dönüyor

      # 6. Saniye: Ana Ekran Geçişi
      - delay: 1s
      - lvgl.page.show: page_home
      - lvgl.widget.show: navbar_container
      - lvgl.widget.show: hdr_shb_bar

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc1-n16r8
  flash_size: 16MB
  framework:
    type: esp-idf
external_components:
  - source:
      type: local
      path: components
    components: [ ds3231 ]
    refresh: 0d

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: "M7hZ9WDG0wVH8K3Hnq6YYGNfjz8UOD8FKq7JoPnZ94A="

ota:
  - platform: esphome

# ============================================================
# DS3231 - Saat
# ============================================================         

time:
  - platform: sntp
    id: internet_saati
    timezone: Europe/Istanbul
    servers:
      - time.google.com
      - time.cloudflare.com
      - 0.tr.pool.ntp.org
  - platform: ds3231
    id: rtc_saati
    address: 0x68
    i2c_id: saat_tutucu
    time_id: internet_saati
    update_interval: 1min

web_server:
  port: 80

spi:
  - id: tft_spi
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13
    
wifi:
  power_save_mode: NONE
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "Balik Yemleyici WiFi"
    password: "12345678"
  on_disconnect:
    then:
      - lvgl.label.update:
          id: header_wifi_icon
          text: "\U000F05AA"
          text_color: 0xEF4444
      - light.turn_on:
          id: rgb_led
          red: 100%

  on_connect:
    then:
      - lvgl.label.update:
          id: header_wifi_icon
          text: "\U000F05A9"
          text_color: 0x10B981

      - light.turn_on:
          id: rgb_led
          green: 100%

      - delay: 3s

      - light.turn_off: rgb_led

  manual_ip:
    static_ip: 192.168.1.69
    gateway: !secret wifi_gateway
    subnet: !secret wifi_subnet
    dns1: 8.8.8.8
    dns2: 1.1.1.1

captive_portal:
button:
  - platform: template
    name: "Test Yemleme"
    on_press:
      then:
        - if:
            condition:
              script.is_running: yemleme_script
            then:
              - logger.log:
                  level: WARN
                  format: "Yemleme zaten çalışıyor."
            else:
              - script.execute: yemleme_script

  - platform: restart
    id: system_restart_btn
    name: "Cihazı Yeniden Başlat"

i2c:
  - sda: GPIO8
    scl: GPIO17
    scan: true
    id: saat_tutucu
    frequency: 100kHz
    

output:
  - platform: ledc
    id: pwm_output
    pin: GPIO5
    frequency: 50Hz

  - platform: ledc
    id: tft_led
    pin: GPIO6
    frequency: 1000Hz

servo:
  - id: yemleyici_servo
    output: pwm_output
    min_level: 0.025
    idle_level: 0.075
    max_level: 0.13
