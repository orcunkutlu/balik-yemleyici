script:
  - id: yemleme_script
    mode: single

    then:
      - lambda: |-
          id(feeding_now) = true;

      - light.turn_on:
          id: rgb_led
          blue: 100%

      - servo.write:
          id: yemleyici_servo
          level: -100%

      - delay: 300ms

      - servo.write:
          id: yemleyici_servo
          level: !lambda "return id(servo_acisi).state / 100.0;"

      - delay: 1000ms

      - servo.write:
          id: yemleyici_servo
          level: -100%

      - delay: 500ms

      - servo.write:
          id: yemleyici_servo
          level: -70%

      - delay: 150ms

      - servo.write:
          id: yemleyici_servo
          level: -100%

      - delay: 150ms

      - servo.detach: yemleyici_servo

      - light.turn_off: rgb_led

      - lambda: |-

          id(feeding_now) = false;
          auto now = id(internet_saati).now();

          if (!now.is_valid())
            return;

          char buffer[32];

          sprintf(
            buffer,
            "%02d.%02d %02d:%02d",
            now.day_of_month,
            now.month,
            now.hour,
            now.minute
          );

          id(son_yemleme_saati) = buffer;
interval:
  - interval: 1s
    then:
      # 1. Ana Ekran Verilerini Canlandırma
      - lvgl.label.update:
          id: clock_value
          text:
            format: "%s"
            args: ['id(internet_saati).now().strftime("%H:%M").c_str()']
      - lvgl.label.update:
          id: header_datetime
          text:
            format: "%s"
            args: ['id(internet_saati).now().strftime("%d %b %H:%M").c_str()']
      - lvgl.label.update:
          id: date_value
          text:
            format: "%s"
            args: ['id(internet_saati).now().strftime("%d.%m.%Y").c_str()']
      - lvgl.label.update:
          id: last_feed_value
          text: !lambda "return id(son_yemleme_saati).c_str();"
      - lvgl.label.update:
          id: next_feed_value
          text: !lambda "return id(sonraki_yemleme_hesapla).state.c_str();"
      - lvgl.label.update:
          id: log_uptime
          text: !lambda "return id(uptime_sensor_text).state.c_str();"

      # 2. Zamanlayıcı Sayfası (Page Feed) Kartlarının Dinamik Renk ve Metin Güncellemeleri
      # Zamanlayıcı 1 Kontrolü
      - lvgl.label.update:
          id: status_feed1
          text: !lambda |-
            char buf[32];
            sprintf(buf, "Prog 1: %02d:%02d • %s", id(yemleme_sira_1).hour, id(yemleme_sira_1).minute, id(yemleme_1_aktif).state ? "AKTIF" : "PASIF");
            return {buf};
      - lvgl.label.update:
          id: status_feed1
          text_color: !lambda "return id(yemleme_1_aktif).state ? 0x10B981 : 0x64748B;"

      # Zamanlayıcı 2 Kontrolü
      - lvgl.label.update:
          id: status_feed2
          text: !lambda |-
            char buf[32];
            sprintf(buf, "Prog 2: %02d:%02d • %s", id(yemleme_sira_2).hour, id(yemleme_sira_2).minute, id(yemleme_2_aktif).state ? "AKTIF" : "PASIF");
            return {buf};
      - lvgl.label.update:
          id: status_feed2
          text_color: !lambda "return id(yemleme_2_aktif).state ? 0x10B981 : 0x64748B;"

      # Zamanlayıcı 3 Kontrolü
      - lvgl.label.update:
          id: status_feed3
          text: !lambda |-
            char buf[32];
            sprintf(buf, "Prog 3: %02d:%02d • %s", id(yemleme_sira_3).hour, id(yemleme_sira_3).minute, id(yemleme_3_aktif).state ? "AKTIF" : "PASIF");
            return {buf};
      - lvgl.label.update:
          id: status_feed3
          text_color: !lambda "return id(yemleme_3_aktif).state ? 0x10B981 : 0x64748B;"

      # 3. Arka Planda Çalışan Gerçek Zamanlı Yemleme Tetikleyicisi
      - lambda: |-
          auto now = id(internet_saati).now();
          if (!now.is_valid()) return;

          int current_minute = now.hour * 60 + now.minute;
          if (current_minute == id(son_tetiklenen_dakika)) return;

          bool execute_feed = false;
          if (id(yemleme_1_aktif).state && now.hour == id(yemleme_sira_1).hour && now.minute == id(yemleme_sira_1).minute) execute_feed = true;
          if (id(yemleme_2_aktif).state && now.hour == id(yemleme_sira_2).hour && now.minute == id(yemleme_sira_2).minute) execute_feed = true;
          if (id(yemleme_3_aktif).state && now.hour == id(yemleme_sira_3).hour && now.minute == id(yemleme_sira_3).minute) execute_feed = true;

          if (execute_feed) {
            id(son_tetiklenen_dakika) = current_minute;
            id(yemleme_script).execute();
          }
  - interval: 30s
    then:
      - lambda: |-
          auto rtc = id(rtc_saati).now();
          auto sntp = id(internet_saati).now();
          if (sntp.is_valid()) {
            ESP_LOGI("SISTEM", "Zaman Senkronize.");
          }

# ============================================================
# RGB LED
# ============================================================
light:
  - platform: esp32_rmt_led_strip
    name: "RGB LED"
    id: rgb_led
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    effects:
      - pulse:
          name: slow_pulse
          transition_length: 1s
          update_interval: 2s

# ============================================================
# Global Değişkenler
# ============================================================  
globals:
  - id: son_tetiklenen_dakika
    type: int
    restore_value: no
    initial_value: '-1'
  - id: feeding_now
    type: bool
    restore_value: no
    initial_value: "false"
    
  - id: last_feed_minute
    type: int
    restore_value: no
    initial_value: '-1'
    
  - id: sistem_hazir
    type: bool
    restore_value: no
    initial_value: "false"

  - id: boot_yuzde
    type: int
    restore_value: no
    initial_value: "0"

  - id: son_yemleme_saati
    type: std::string
    restore_value: yes
    initial_value: '"--:--"'

  - id: yem_seviyesi_yuzde
    type: int
    restore_value: no
    initial_value: "72"
number:
  - platform: template
    name: "Servo Açısı"
    id: servo_acisi
    optimistic: true
    min_value: -100
    max_value: 100
    step: 1
    initial_value: 92
    restore_value: true
switch:
  - platform: template
    name: "Yemleme 1 Aktif"
    id: yemleme_1_aktif
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Yemleme 2 Aktif"
    id: yemleme_2_aktif
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Yemleme 3 Aktif"
    id: yemleme_3_aktif
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    
datetime:
  - platform: template
    id: yemleme_sira_1
    name: "Yemleme 1"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "08:00:00"

  - platform: template
    id: yemleme_sira_2
    name: "Yemleme 2"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "19:00:00"

  - platform: template
    id: yemleme_sira_3
    name: "Yemleme 3"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
# ============================================================
# DOKUNMATİK EKRAN (XPT2046)
# ============================================================
touchscreen:
  platform: xpt2046
  id: ekranim_touch
  cs_pin: GPIO15
  spi_id: tft_spi
  threshold: 400
  interrupt_pin: GPIO16
  update_interval: 50ms
  transform:
    mirror_x: false
    mirror_y: true

  on_touch:
    - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );
  calibration:
    x_min: 450
    x_max: 3500
    y_min: 550
    y_max: 3770

# ============================================================
# DS18B20
# ============================================================
one_wire:
  - platform: gpio
    pin: GPIO4

# ============================================================
# SENSÖRLER
# ============================================================
sensor:
  - platform: dallas_temp
    name: "Water Temperature"
    id: water_temp
    update_interval: 2s
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    on_value:
      then:
        - lvgl.label.update:
            id: water_temp_value
            text:
              format: "%.1f"
              args: ['x']
  - platform: vl53l0x
    name: "Yem Seviyesi Sensörü"
    address: 0x29
    i2c_id: saat_tutucu
    update_interval: 5s
    long_range: false     # Yem kutusu için kısa mesafe daha stabil ve hızlıdır
    timeout: 100ms        # I2C meşguliyetinden dolayı kilitlenmeleri önlemek için varsayılan 10ms artırıldı
    
    filters:
      - filter_out: nan   # Kilitlenme veya hatalı okumadan dönen 'nan' değerlerini çöpe atar
      
      # Metre (m) olarak gelen standart değeri Milimetre (mm) cinsine çevirir
      - multiply: 1000.0
      
      # Yem yüzeyi pürüzlü olduğu için anlık sıçramaları engeller.
      # Son 5 ölçümü sıraya dizer, en küçük ve en büyük saçma değerleri atıp 
      # tam ortadaki en mantıklı değeri (medyan) sisteme iletir.
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
          
      # İsteğe bağlı: Değer çok sık değişmesin isterseniz eski 30s ortalamanızı da medyanın altına ekleyebilirsiniz
      - throttle_average: 30s
    on_value:
      then:
        - lambda: |-
            // Kalibrasyon: Deponun tavanından tabanına maksimum boş mesafe örn: 150mm olsun. 
            // Sensör 30mm okuyorsa depo doludur.
            float empty_distance = 150.0; 
            float full_distance = 30.0;
            float pct = ((empty_distance - x) / (empty_distance - full_distance)) * 100.0;
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            id(yem_seviyesi_yuzde) = (int)pct;
        - lvgl.bar.update:
            id: home_feed_bar
            value: !lambda "return id(yem_seviyesi_yuzde);"
        - lvgl.label.update:
            id: home_feed_pct_txt
            text: !lambda |-
              char buf[12];
              sprintf(buf, "%%%d", id(yem_seviyesi_yuzde));
              return {buf};
              
  - platform: uptime
    name: "Uptime Sensor"
    id: uptime_sensor_seconds
    entity_category: diagnostic
    internal: true

  - platform: template
    id: free_heap

  - platform: template
    id: free_psram

  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 30s

    on_value:
      then:
        - text_sensor.template.publish:
            id: wifi_ikonu
            state: !lambda |-
              if (x > -55)
                return "1";

              if (x > -65)
                return "2";

              if (x > -75)
                return "3";

              return "0";

  - platform: copy
    source_id: wifi_rssi
    id: wifi_signal_percent
    name: "WiFi Sinyal"
    filters: 
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""

# ============================================================
# TFT EKRAN (ILI9341)
# ============================================================
display:
  - platform: mipi_spi
    model: ILI9341
    cs_pin: GPIO10
    dc_pin: GPIO9
    id: ekranim
    reset_pin: GPIO14
    spi_id: tft_spi
    rotation: 0°
    dimensions:
      width: 240
      height: 320
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never

# ============================================================
# METİN SENSÖRLER
# ============================================================
text_sensor:
  - platform: template
    id: wifi_ikonu
  - platform: template
    name: "Sonraki Yemleme"
    id: sonraki_yemleme
    icon: "mdi:clock-outline"
    update_interval: 15s
    lambda: |-
      auto now = id(internet_saati).now();
      if (!now.is_valid()) return std::string("Senkron...");
      
      int current_minute = now.hour * 60 + now.minute;
      int feed1 = id(yemleme_1_aktif).state ? id(yemleme_sira_1).hour * 60 + id(yemleme_sira_1).minute : -1;
      int feed2 = id(yemleme_2_aktif).state ? id(yemleme_sira_2).hour * 60 + id(yemleme_sira_2).minute : -1;
      int feed3 = id(yemleme_3_aktif).state ? id(yemleme_sira_3).hour * 60 + id(yemleme_sira_3).minute : -1;
      
      int next_feed = -1;
      if (feed1 > current_minute) next_feed = feed1;
      if (feed2 > current_minute && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
      if (feed3 > current_minute && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
      
      if (next_feed == -1) {
        if (feed1 != -1) next_feed = feed1;
        if (feed2 != -1 && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
        if (feed3 != -1 && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
      }
      
      if (next_feed == -1) return std::string("Yok");
      
      char buffer[16];
      sprintf(buffer, "%02d:%02d", next_feed / 60, next_feed % 60);
      return std::string(buffer);
  - platform: template
    name: "Sonraki Yemleme Hesaplayıcı"
    id: sonraki_yemleme_hesapla
    update_interval: 15s
    lambda: |-
      auto now = id(internet_saati).now();
      if (!now.is_valid()) return std::string("--:--");
      
      int current_minute = now.hour * 60 + now.minute;
      int feed1 = id(yemleme_1_aktif).state ? id(yemleme_sira_1).hour * 60 + id(yemleme_sira_1).minute : -1;
      int feed2 = id(yemleme_2_aktif).state ? id(yemleme_sira_2).hour * 60 + id(yemleme_sira_2).minute : -1;
      int feed3 = id(yemleme_3_aktif).state ? id(yemleme_sira_3).hour * 60 + id(yemleme_sira_3).minute : -1;
      
      int next_feed = -1;
      if (feed1 > current_minute) next_feed = feed1;
      if (feed2 > current_minute && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
      if (feed3 > current_minute && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
      
      if (next_feed == -1) {
        if (feed1 != -1) next_feed = feed1;
        if (feed2 != -1 && (next_feed == -1 || feed2 < next_feed)) next_feed = feed2;
        if (feed3 != -1 && (next_feed == -1 || feed3 < next_feed)) next_feed = feed3;
      }
      
      if (next_feed == -1) return std::string("Yok");
      
      char buffer[16];
      sprintf(buffer, "%02d:%02d", next_feed / 60, next_feed % 60);
      return std::string(buffer);
  - platform: template
    name: "Yemleme Döngüsü"
    id: yemleme_dongusu
    update_interval: 10s
    lambda: |-
      int total = (id(yemleme_1_aktif).state ? 1 : 0) + (id(yemleme_2_aktif).state ? 1 : 0) + (id(yemleme_3_aktif).state ? 1 : 0);
      char buffer[16];
      sprintf(buffer, "Günde %d Kez", total);
      return {buffer};
  - platform: uptime
    id: uptime_sensor_text
    name: Uptime
    format:
      separator: " "
      days: " Gün"
      hours: " Saat"
      minutes: " Dakika"
      seconds: " saniye"
    icon: mdi:clock-start
  - platform: wifi_info
    ip_address:
      name: "IP Adresi"
      id: wifi_ip
binary_sensor:
  - platform: status
    name: "Balık Yemleyici"
    id: wifi_status
