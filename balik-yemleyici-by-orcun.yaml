# Board: Espressif ESP32-S3-DevKitC-1-N16R8V (16 MB Flash Quad, 8 MB PSRAM Octal)
# Definition: definitions/boards/esp32-s3-devkitc1-n16r8/manifest.yaml

esphome:
  name: balik-yemleyici-by-orcun
  friendly_name: "Balık Yemleyici By Orçun"
  on_boot:
    priority: -100
    then:
      - lvgl.page.show: page_boot
      - lvgl.label.update:
          id: header_power_icon
          text: "\U000F1C3C"       # Priz ikonu (varsayılan)
          text_color: 0x10B981    # Yeşil
      # 3. Saniye: Ana Ekran Geçişi
      - delay: 3s
      - lvgl.page.show: page_home
      - lvgl.widget.show: navbar_container
      - lvgl.widget.show: hdr_shb_bar
      # Ekranı başlangıçta güncelle
      - script.execute: yemleme_guncellemesi_ekran

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc1-n16r8
  flash_size: 16MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [ ds3231 ]
    refresh: 0d

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  reboot_timeout: 0s
  encryption:
    key: "M7hZ9WDG0wVH8K3Hnq6YYGNfjz8UOD8FKq7JoPnZ94A="

ota:
  - platform: esphome
# ============================================================
# DS3231 - Saat
# ============================================================         
time:
  - platform: sntp
    id: internet_saati
    timezone: Europe/Istanbul
    servers:
      - time.google.com
      - time.cloudflare.com
      - 0.tr.pool.ntp.org
  - platform: ds3231
    id: rtc_saati
    address: 0x68
    i2c_id: saat_tutucu
    time_id: internet_saati
    update_interval: 15min

web_server:
  port: 80
  ota: false
  version: 3
  sorting_groups:
    - id: group_feed_control
      name: "Yemleme Kontrolü"
      sorting_weight: 10
    - id: group_schedule
      name: "Plan & Zamanlama"
      sorting_weight: 20
    - id: group_status
      name: "Durum & Sensörler"
      sorting_weight: 30
    - id: group_system
      name: "Sistem & Ağ"
      sorting_weight: 40
spi:
  - id: tft_spi
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13
wifi:
  power_save_mode: LIGHT
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  post_connect_roaming: false
  ap:
    ssid: "Balik Yemleyici WiFi"
    password: "12345678"
  on_disconnect:
    then:
      - lvgl.label.update:
          id: header_wifi_icon
          text: "\U000F05AA"
          text_color: 0xEF4444
      - light.turn_on:
          id: rgb_led
          red: 100%
          green: 0%
          blue: 0%

  on_connect:
    then:
      - lvgl.label.update:
          id: header_wifi_icon
          text: "\U000F05A9"
          text_color: 0x10B981

      - light.turn_on:
          id: rgb_led
          green: 100%
          red: 0%
          blue: 0%

      - delay: 3s

      - light.turn_off: rgb_led

  manual_ip:
    static_ip: !secret wifi_static_ip
    gateway: !secret wifi_gateway
    subnet: !secret wifi_subnet
    dns1: 8.8.8.8
    dns2: 1.1.1.1

#deep_sleep:
#  id: derin_uyku
#  run_duration: 20s

espnow:
  enable_on_boot: true
  channel: 2
  peers:
    - !secret servo_mac_address
  on_receive:
    - lambda: |-
        if (size < 1) return;
        uint8_t komut_kodu = data[0];
        switch (komut_kodu) {
          case 0x03:
            if (size >= 3) {
              uint8_t yem_yuzdesi = data[2];  // data[1] zaten 0x00
              ESP_LOGI("EspNow_Servo", "[0x03] Yem seviyesi: %u%%", yem_yuzdesi);
              id(yem_seviyesi_sensor).publish_state(yem_yuzdesi);
            }
            break;

          case 0x10:
            if (size >= 2) {
              uint8_t durum_kodu = data[1];
              ESP_LOGI("EspNow_Servo", "[0x10] Servo modülü çevrimiçi. Durum Kodu: 0x%02X", durum_kodu);
              // İleride ana ekrana "Servo Bağlantısı: OK" yazdırmak istersen 
              // burayı bir template binary_sensor tetiklemek için kullanabiliriz.
            }
            break;
            
          case 0x02:
            if (size >= 2) {
              ESP_LOGI("EspNow_Servo", "[0x02] Servo batarya seviyesi: %%%d", data[1]);
            }
            break;
            
          default:
            ESP_LOGW("EspNow_Servo", "Bilinmeyen komut kodu alındı: 0x%02X", komut_kodu);
            break;
        }
captive_portal:
image:
  - file: "resimler/logom.png"
    id: boot_logo
    type: RGB565
    resize: 200x200
    transparency: alpha_channel

button:
  - platform: template
    name: "Yemlemeyi Başlat"
    id: btn_yemleme_baslat
    icon: "mdi:fishbowl"
    web_server:
      sorting_group_id: group_feed_control
      sorting_weight: 10
    on_press:
      then:
        - script.execute: yemleme_script
        - logger.log: "Yemleme (0x01) komutu gönderildi."
  # 2. Alıcı Cihazdan Durum Raporu İsteyen Buton (0x03 Komutu)
  - platform: template
    name: "Cihaz Durumunu Sorgula"
    id: btn_durum_iste
    icon: "mdi:refresh-circle"
    web_server:
      sorting_group_id: group_feed_control
      sorting_weight: 20
    on_press:
      then:
        - espnow.send:
            address: !secret servo_mac_address
            data: [0x03]
        - logger.log: "Durum Sorgu (0x03) komutu gönderildi."

  - platform: restart
    id: system_restart_btn
    name: "Cihazı Yeniden Başlat"
    icon: "mdi:restart"
    web_server:
      sorting_group_id: group_system
      sorting_weight: 10

i2c:
  - sda: GPIO8
    scl: GPIO17
    scan: true
    id: saat_tutucu
    frequency: 100kHz

output:
  - platform: ledc
    id: tft_led
    pin: GPIO6
    frequency: 1000Hz
