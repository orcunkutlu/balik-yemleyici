                  y: 10
                  width: 75
                  height: 26
                  bg_color: 0x1E293B
                  widgets:
                    - label: {id: txt_plan_status_btn, text: "AÇ", align: CENTER, text_font: font_10, text_color: 0xFFFFFF}
                  on_click:
                    then:
                      - lambda: |-
                          int p = id(secili_plan);
                          if (p == 1) id(yemleme_1_aktif).toggle();
                          else if (p == 2) id(yemleme_2_aktif).toggle();
                          else if (p == 3) id(yemleme_3_aktif).toggle();

              # Saat Arttır/Azalt Blokları
              - button:
