                        text_align: CENTER
                        long_mode: SCROLL_CIRCULAR  # Yazı uzun olacağı için kayma efekti verildi
                        text_font: font_10  # Okunabilirlik ve sığması adına font optimize edildi
                    - label:
                        id: uptime_label
