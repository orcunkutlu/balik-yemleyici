# ============================================================
# LVGL SCRIPT
# ============================================================
lvgl:
  page_wrap: false
  id: lvgl_id
  displays:
    - ekranim

  on_idle:
    timeout: !lambda |-
      return id(ekran_bekleme_suresi).state * 1000;

    then:
      - logger.log: "Ekran boşta kaldı"
      - light.turn_off: ekran_arka_isigi
      - lvgl.pause:

  theme:
    buttonmatrix:
      bg_color: 0x070E1B
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      items:
        bg_color: 0x070E1B
        bg_opa: 95%
        border_width: 0
        radius: 0
        pad_all: 0
        text_color: 0x8E9FB8      # Inactive (pasif) renk — gri-mavi
        # PRESSED (basılı anlık)
        pressed:
          bg_color: 0x0F172A
          bg_opa: COVER
        # CHECKED/ACTIVE (aktif sayfa) — ŞAHANE RENK
        checked:
          bg_color: 0x1E293B
          bg_opa: COVER
          text_color: 0xFBBF24     # Amber/Gold — aktif sayfa rengi ✨
    button:
        bg_color: 0x1976D2
        radius: 12
        text_color: 0xFFFFFF
  top_layer:
    bg_opa: TRANSP
    pad_all: 0
    
    widgets:
      # GLOBAL HEADER
      - obj:
          id: hdr_shb_bar
          x: 0
          y: 0
          width: 240
          height: 42
          bg_color: 0x070E1B
          bg_opa: 95%
          border_width: 0
          radius: 0
          pad_all: 0
          widgets:
            - label:
                id: header_title
                x: 14
                y: 4
                width: 180
                height: 20
                text: "Ana Ekran"
                text_color: 0xF1F5F9
                text_align: LEFT
                long_mode: CLIP
                text_font: font_16
            - label:
                id: header_datetime
                x: 14
                y: 26
                width: 170
                height: 12
                text: "16 Haz 00:00"
                text_color: 0x8E9FB8
                text_font: font_10
            - label:
                id: header_wifi_icon
                x: 210
                y: 10
                width: 20
                height: 20
                text: "\U000F05AA"
                text_font: mdi_icons
                text_align: CENTER
                text_color: 0xEF4444

      - obj:
          id: navbar_container
          align: BOTTOM_MID
          x: 0
          y: 0
          width: 240
          height: 40
          bg_color: 0x070E1B
          bg_opa: 95%
          border_width: 0
          radius: 0
          pad_all: 0
          hidden: true
          widgets:
            - buttonmatrix:
                id: footer_nav
                x: 0
                y: 0
                width: 240
                height: 40
                align: CENTER
                bg_color: 0x070E1B
                text_font: mdi_icons
                border_width: 0
                pad_all: 0
                pad_row: 0
                pad_column: 0
                one_checked: true
                
                rows:
                  - buttons:
                      - id: nav_home
                        text: "\U000F02DC"
                        width: 1
                        control:
                          checkable: true
                          checked: true
                        on_press:
                          then:
                            - lvgl.page.show: page_home
                            - lvgl.label.update:
                                id: header_title
                                text: "Ana Ekran"
                            - lvgl.matrix.button.update:
                                id: nav_home
                                control: {checked: true}
                            - lvgl.matrix.button.update:
                                id: nav_feed
                                control: {checked: false}
                            - lvgl.matrix.button.update:
                                id: nav_log
                                control: {checked: false}
                            - lvgl.matrix.button.update:
                                id: nav_set
                                control: {checked: false}
                                    
                      - id: nav_feed
                        text: "\U000F0198"
                        width: 1
                        control:
                          checkable: true
                        on_press:
                          then:
                            - lvgl.page.show: page_feed
                            - lvgl.label.update:
                                id: header_title
                                text: "Zamanlama Planı"
                            - lvgl.matrix.button.update:
                                id: nav_home
                                control: {checked: false}
                            - lvgl.matrix.button.update:
                                id: nav_feed
                                control: {checked: true}
                            - lvgl.matrix.button.update:
                                id: nav_log
                                control: {checked: false}
                            - lvgl.matrix.button.update:
                                id: nav_set
                                control: {checked: false}
                                    
                      - id: nav_log
                        text: "\U000F0C9E"
                        width: 1
                        control:
                          checkable: true
                        on_press:
                          then:
                            - lvgl.page.show: page_log
                            - lvgl.label.update:
                                id: header_title
                                text: "Sistem Kayıtları"
                            - lvgl.matrix.button.update:
                                id: nav_home
                                control: {checked: false}
                            - lvgl.matrix.button.update:
                                id: nav_feed
                                control: {checked: false}
                            - lvgl.matrix.button.update:
                                id: nav_log
                                control: {checked: true}
                            - lvgl.matrix.button.update:
                                id: nav_set
                                control: {checked: false}
                                    
                      - id: nav_set
                        text: "\U000F0493"
                        width: 1
                        control:
                          checkable: true
                        on_press:
                          then:
                            - lvgl.page.show: page_settings
                            - lvgl.label.update:
                                id: header_title
                                text: "Cihaz Ayarlar"
                            - lvgl.matrix.button.update:
                                id: nav_home
                                control: {checked: false}
                            - lvgl.matrix.button.update:
                                id: nav_feed
                                control: {checked: false}
                            - lvgl.matrix.button.update:
                                id: nav_log
                                control: {checked: false}
                            - lvgl.matrix.button.update:
                                id: nav_set
                                control: {checked: true}
