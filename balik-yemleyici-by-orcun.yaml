# TFT EKRAN (ILI9341)
# ============================================================
display:
  - platform: mipi_spi
    model: ILI9341
    cs_pin: GPIO10
    dc_pin: GPIO9
    id: ekranim
    reset_pin: GPIO14
    spi_id: tft_spi
    rotation: 0°
