# ========================================================
# BALIK YEMLEYICI SERVO MODÜLÜ
# ESP32-CAM + SERVO
# ========================================================

esphome:
  name: balik-yemleyici-servo
  friendly_name: Balık Yemleyici Servo

esp32:
  board: esp32cam
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: "3.1"
wifi:
  id: wifi_durum
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  manual_ip:
    static_ip: !secret servo_static_ip
    gateway: !secret wifi_gateway
    subnet: !secret wifi_subnet
    dns1: 1.1.1.1
    dns2: 8.8.8.8

# ========================================================
# ESP-NOW: Ana cihazdan komut alma
# ========================================================
espnow:
  enable_on_boot: true
  channel: 2
  peers:
    - !secret baliktank_mac_address
  on_receive:
    - lambda: |-
        if (size < 1) {
          ESP_LOGW("espnow", "Bos paket alindi, atlaniyor");
          return;
        }
        
        uint8_t komut = data[0];
        
        switch (komut) {
          case 0x01:  // YEMLEME_KOMUTU
            ESP_LOGI("espnow", "YEMLEME_KOMUTU alindi!");
            // Doğrudan scripti çağırıyoruz, interval karmaşasından kurtulduk
            id(yemleme_script).execute();
            break;
            
          case 0x02:  // SERVO_ACI_AYARLA
            if (size >= 2) {
              int8_t aci = (int8_t)data[1];
              // Değeri -100 ile 100 arasında sınırlar
              if (aci < -100) aci = -100;
              if (aci > 100) aci = 100;
              ESP_LOGI("espnow", "Servo aci ayari güncellendi: %d%%", aci);
              id(servo_acisi_hedef) = aci;
            }
            break;
            
          case 0x03:  // DURUM_ISTE
            ESP_LOGI("espnow", "Durum istegi alindi");
            id(durum_gonder_script).execute();
            break;
            
          default:
            ESP_LOGW("espnow", "Bilinmeyen komut: 0x%02X", komut);
            break;
        }

logger:
  level: DEBUG

api:
  reboot_timeout: 0s
  encryption:
    key: "9kKnZ/GA8GOJkSP13pSMAyJK8xtURfB8yPVRTIeUdHk="

ota:
  - platform: esphome

# ========================================================
# OUTPUTS
# ========================================================
output:
  - platform: ledc
    pin: GPIO16
    id: pwm_output
    frequency: 50Hz

  - platform: gpio
    pin: GPIO4
    id: flash_led

# ========================================================
# SERVO
# ========================================================
servo:
  - id: feeder_servo
    output: pwm_output
    min_level: 0.025
    idle_level: 0.075
    max_level: 0.13

# ========================================================
# GLOBALS
# ========================================================
globals:
  - id: servo_acisi_hedef
    type: int
    restore_value: no
    initial_value: "92"

# ========================================================
# SCRIPTS
# ========================================================
script:
  - id: yemleme_script
    mode: restart  
    then:
      # Flaş LED aç
      - output.turn_on: flash_led
      
      # 1. Baslangic pozisyonu (kapali)
      - servo.write:
          id: feeder_servo
          level: -100%
      - delay: 300ms
      
      # 2. Kapak acma (yem dokulme)
      - servo.write:
          id: feeder_servo
          level: !lambda "return id(servo_acisi_hedef) / 100.0;"
      - delay: 1000ms
      
      # 3. Silkelenme (takilma onleme)
      - servo.write:
          id: feeder_servo
          level: -100%
      - delay: 500ms
      - servo.write:
          id: feeder_servo
          level: -70%
      - delay: 150ms
      - servo.write:
          id: feeder_servo
          level: -100%
      - delay: 150ms
      
      # 4. Servo enerjisini kes (Isınmayı ve titremeyi önler)
      - servo.detach: feeder_servo
      
      # Flaş LED kapat
      - output.turn_off: flash_led

  - id: durum_gonder_script
    mode: single
    then:
      - espnow.send:
          address: !secret baliktank_mac_address
          data: [0x10, 0x01]
      - logger.log: "Durum verisi gönderildi."

# ========================================================
# INTERVALS
# ========================================================
interval:
  - interval: 30s
    then:
      - script.execute: durum_gonder_script