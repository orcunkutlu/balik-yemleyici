# ========================================================
# BALIK YEMLEYICI SERVO MODÜLÜ
# ESP32-CAM AI-Thinker + SERVO + Vl53l0X
# ========================================================
esphome:
  name: balik-yemleyici-servo
  friendly_name: Balık Yemleyici Servo
  on_boot:
    priority: 600
    then:
      - if:
          condition:
            lambda: 'return id(kritik_uyku_modu);'
          then:
            # Kritik moddayız: ana cihaza "uyandım" de, run_duration dolunca
            # cevap gelmediyse zaten otomatik tekrar uyuyacak
            - script.execute: durum_gonder_script
          else:
            # Normal mod: run_duration'ın otomatik uyku tetiklemesini iptal et,
            # cihaz açık kalsın (eskisi gibi her zaman uyanık çalışsın)
            - deep_sleep.prevent: derin_uyku
esp32:
  board: esp32cam
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: "3.1"
wifi:
  id: wifi_durum
  networks:
    - ssid: !secret wifi_ssid          # Ev router'ı
      password: !secret wifi_password
      channel: 2
    - ssid: "Balik Yemleyici WiFi"      # Ana cihazın fallback AP'si
      password: "12345678"
      channel: 2
      priority: -1
  fast_connect: true
  reboot_timeout: 0s
  post_connect_roaming: false
  manual_ip:
    static_ip: !secret servo_static_ip
    gateway: !secret wifi_gateway
    subnet: !secret wifi_subnet
    dns1: 1.1.1.1
    dns2: 8.8.8.8
  on_connect:
    then:
      - script.execute: durum_gonder_script
# =======================================================
# ESP-NOW: Ana cihazdan komut alma
# ========================================================
espnow:
  enable_on_boot: true
  channel: 2
  peers:
    - !secret baliktank_mac_address
  on_receive:
    - lambda: |-
        if (size < 1) {
          ESP_LOGW("espnow", "Bos paket alindi, atlaniyor");
          return;
        }
        uint8_t komut = data[0];
        switch (komut) {
          case 0x01:  // YEMLEME_KOMUTU
            ESP_LOGI("espnow", "Yemleme komutu alindi!");
            id(yemleme_script).execute();
            break;
          case 0x02:  // SERVO_ACI_AYARLA
            if (size >= 2) {
              int8_t aci = (int8_t)data[1];
              // Değeri -100 ile 100 arasında sınırlar
              if (aci < -100) aci = -100;
              if (aci > 100) aci = 100;
              ESP_LOGI("espnow", "Servo açı ayarı güncellendi: %d%%", aci);
              id(servo_acisi_hedef) = aci;
            }
            break;
          case 0x03:  // DURUM_ISTE
            ESP_LOGI("espnow", "Durum istegi alindi");
            id(durum_gonder_script).execute();
            break;
          case 0x04: // Derin UYKUYA gir (pil kritik)
            ESP_LOGI("espnow", "Uykuya giriyorum");
            id(uyku_modu).execute();
            break;
          case 0x05: // UYAN / devam et (pil normale döndü)
            ESP_LOGI("espnow", "Uyanma komutu alindi, normal calismaya donuluyor");
            id(uyan_modu).execute();
            break;
          default:
            ESP_LOGW("espnow", "Bilinmeyen komut: 0x%02X", komut);
            break;
        }
logger:
  level: DEBUG

api:
  reboot_timeout: 0s
  encryption:
    key: "9kKnZ/GA8GOJkSP13pSMAyJK8xtURfB8yPVRTIeUdHk="
ota:
  - platform: esphome
i2c:
  - sda: GPIO13
    scl: GPIO14
    scan: true
    frequency: 100kHz
deep_sleep:
  id: derin_uyku
  # Kritik modda her uyanışta bu kadar süre açık kal (check-in göndermeye yeter),
  # süre dolunca ana cihazdan "devam" cevabı gelmediyse otomatik tekrar uyur.
  run_duration: 30s
  # Kritik modda uyku süresi (ana cihazın 30dk'lık yedek periyodundan kısa
  # tutuyoruz ki ana cihaz normale döndüğünde servo en geç bu kadar sürede fark etsin)
  sleep_duration: 5min
# ========================================================
# OUTPUTS
# ========================================================
output:
  - platform: ledc
    pin: GPIO16
    id: pwm_output
    frequency: 50Hz

  - platform: gpio
    pin: GPIO4
    id: flash_led
# ========================================================
# SERVO
# ========================================================
servo:
  - id: yemleyici_servo
    output: pwm_output
    min_level: 0.025
    idle_level: 0.075
    max_level: 0.13
# ========================================================
# YEM SEVİYESİ SENSÖRÜ
# ========================================================
sensor:
  - platform: vl53l0x
    name: "Yem Seviyesi Yüzdesi"
    id: yem_seviyesi_sensoru
    address: 0x29
    update_interval: 5s
    long_range: false
    timeout: 100ms
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - filter_out: nan
      - multiply: 1000.0  # Metreyi mm'ye çevirir (0.073m -> 73mm)
      - median:
          window_size: 5
          send_every: 5
      - calibrate_linear:
          - 56.0 -> 0.0
          - 20.0 -> 100.0
      # CLAMP FILTRESINI BURAYA ALDIK: Kalibrasyon sonrası çıkan % sonucunu 0-100 arasında tutar.
      - clamp:
          min_value: 0
          max_value: 100
          ignore_out_of_range: false # out of range olanları yok sayma, sınırla (0 veya 100 yap)
    on_value:
      then:
        - script.execute: yem_seviyesi_gonder
# ========================================================
# GLOBALS
# ========================================================
globals:
  - id: servo_acisi_hedef
    type: int
    restore_value: no
    initial_value: "92"
  - id: kritik_uyku_modu
    type: bool
    restore_value: yes
    initial_value: "false"
# ========================================================
# SCRIPTS
# ========================================================
script:
  - id: yemleme_script
    mode: single  
    then:
      # Flaş LED aç
      - output.turn_on: flash_led
      # 1. Baslangic pozisyonu (kapali)
      - servo.write:
          id: yemleyici_servo
          level: -100%
      - delay: 300ms
      # 2. Kapak acma (yem dokulme)
      - servo.write:
          id: yemleyici_servo
          level: !lambda "return id(servo_acisi_hedef) / 100.0;"
      - delay: 1000ms
      # 3. Silkelenme (takilma onleme)
      - servo.write:
          id: yemleyici_servo
          level: -100%
      - delay: 500ms
      - servo.write:
          id: yemleyici_servo
          level: -70%
      - delay: 150ms
      - servo.write:
          id: yemleyici_servo
          level: -100%
      - delay: 150ms
      # 4. Servo enerjisini kes (Isınmayı ve titremeyi önler)
      - servo.detach: yemleyici_servo
      # Flaş LED kapat
      - output.turn_off: flash_led
  - id: durum_gonder_script
    mode: single
    then:
      - espnow.send:
          address: !secret baliktank_mac_address
          data: [0x10, 0x01]
      - logger.log: "Durum verisi gönderildi."
  - id: yem_seviyesi_gonder
    mode: single
    then:
      - espnow.send:
          address: !secret baliktank_mac_address
          data: !lambda |-
            uint8_t yuzde = (uint8_t)id(yem_seviyesi_sensoru).state;
            return {0x03, 0x00, yuzde};
      - lambda: |-
          ESP_LOGI("espnow", "Yem seviyesi (%% %u) ESP-NOW ile gönderildi.", (unsigned int)id(yem_seviyesi_sensoru).state);
  - id: uyku_modu
    mode: single
    then:
      - lambda: 'id(kritik_uyku_modu) = true;'
      - logger.log: "Kritik pil: uyku döngüsüne giriliyor."
      # sleep_duration/run_duration artık deep_sleep: bloğunda tanımlı
      - deep_sleep.enter: derin_uyku

  - id: uyan_modu
    mode: single
    then:
      - lambda: 'id(kritik_uyku_modu) = false;'
      - deep_sleep.prevent: derin_uyku   # olası run_duration geri sayımını iptal et
      - logger.log: "Normal çalışmaya dönüldü."
      - script.execute: durum_gonder_script
# ========================================================
# INTERVALS
# ========================================================
interval:
  - interval: 30s
    then:
      - script.execute: durum_gonder_script