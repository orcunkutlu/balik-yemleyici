# ========================================================
# OLED
# ========================================================

display:
  - platform: ssd1306_i2c
    model: SSD1306_128X64
    address: 0x3C
    id: ekranim
    update_interval: 500ms
    pages:

      - id: boot_page
        lambda: |-
          it.fill(COLOR_OFF);

          static bool init = false;
          static int frame = 0;
      
          if (!init)
          {
            frame = 0;
            init = true;
          }
      
          frame++;

          it.printf(114, 24, id(font_orta), TextAlign::RIGHT, "Orçun KUTLU");
          it.printf(14, 4, id(font_orta), "Yemleyici by");

          const int bar_width = 80;
          const int bar_x = 24;
          const int bar_y = 54;
      
          it.rectangle(
            bar_x,
            bar_y,
            bar_width,
            6
          );
      
          int w = frame % (bar_width + 10);
      
          if (w > bar_width)
            w = bar_width;
      
          it.filled_rectangle(
            bar_x + 2,
            bar_y + 2,
            w - 2,
            2
          );

      - id: ota_page
        lambda: |-

          it.fill(COLOR_OFF);

          it.printf(
            4,
            20,
            id(font_orta),
            "GÜNCELLENİYOR"
          );

          it.rectangle(
            14,
            44,
            100,
            10
          );

          int progress =
            (id(ota_progress_percent) * 96) / 100;

          // Taşma koruması
          if (progress > 96)
            progress = 96;

          if (progress < 0)
            progress = 0;

          it.filled_rectangle(
            16,
            46,
            progress,
            6
          );
            
      - id: feeding_page
        lambda: |-

          it.fill(COLOR_OFF);

          if (id(feeding_frame) < 96)
            id(feeding_frame) += 8;

          if (id(feeding_frame) > 96)
            id(feeding_frame) = 96;

          it.printf(
            64,
            18,
            id(font_orta),
            TextAlign::TOP_CENTER,
            "YEM VERİLİYOR"
          );

          it.rectangle(
            14,
            42,
            100,
            10
          );

          it.filled_rectangle(
            16,
            44,
            id(feeding_frame),
            6
          );

      - id: main_page
        lambda: |-

          it.fill(COLOR_OFF);

          int wifi_x = 2;

          if (id(wifi_durum).is_connected())
          {
            it.filled_circle(wifi_x + 3, 6, 1);

            it.draw_pixel_at(
              wifi_x + 3,
              10
            );

            it.line(
              wifi_x + 2,
              8,
              wifi_x + 4,
              8
            );

            it.line(
              wifi_x + 1,
              6,
              wifi_x + 5,
              6
            );

            it.line(
              wifi_x + 0,
              4,
              wifi_x + 6,
              4
            );

            int pct =
              (int)id(wifi_signal_percent).state;

            int bar_x = 14;

            if (pct > 80)
            {
              it.filled_rectangle(bar_x, 10, 2, 2);
              it.filled_rectangle(bar_x + 4, 8, 2, 4);
              it.filled_rectangle(bar_x + 8, 6, 2, 6);
              it.filled_rectangle(bar_x + 12, 4, 2, 8);
            }
            else if (pct > 60)
            {
              it.filled_rectangle(bar_x, 10, 2, 2);
              it.filled_rectangle(bar_x + 4, 8, 2, 4);
              it.filled_rectangle(bar_x + 8, 6, 2, 6);
            }
            else if (pct > 40)
            {
              it.filled_rectangle(bar_x, 10, 2, 2);
              it.filled_rectangle(bar_x + 4, 8, 2, 4);
            }
            else if (pct > 20)
            {
              it.filled_rectangle(bar_x, 10, 2, 2);
            }
          }
          else
          {
            it.line(2, 2, 12, 12);
            it.line(12, 2, 2, 12);
          }

          it.line(
            0,
            15,
            128,
            15
          );

          it.printf(
            126,
            2,
            id(font_kucuk),
            TextAlign::TOP_RIGHT,
            "%s",
            id(wifi_ip).state.c_str()
          );

          it.printf(
            4,
            20,
            id(font_kucuk),
            "Son Yem"
          );

          it.printf(
            124,
            20,
            id(font_kucuk),
            TextAlign::TOP_RIGHT,
            "%s",
            id(son_yemleme).c_str()
          );

          it.printf(
            4,
            33,
            id(font_kucuk),
            "Sonraki Yem"
          );

          it.printf(
            124,
            33,
            id(font_kucuk),
            TextAlign::TOP_RIGHT,
            "%s",
            id(sonraki_yemleme).state.c_str()
          );

          it.printf(
            4,
            46,
            id(font_kucuk),
            "Döngü"
          );

          it.printf(
            124,
            46,
            id(font_kucuk),
            TextAlign::TOP_RIGHT,
            "%s",
            id(yemleme_dongusu).state.c_str()
          );
